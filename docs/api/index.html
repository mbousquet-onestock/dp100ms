<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery Promise API</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"><style>
:root{
  /* OneStock tokens (neutral ramp, primary teal, status colours, chrome) */
  --primary:#24bdb0;--primary-hover:#50cac0;--primary-tint:rgba(36,189,176,.10);
  --chrome:#18244a;--chrome-text:rgba(255,255,255,.82);--chrome-muted:rgba(255,255,255,.55);
  --bg:#fafafa;--surface:#ffffff;--surface-alt:#f7f7f7;--border:#e5e5e5;
  --text:#333333;--text-2:#7f7f7f;--text-3:#b2b2b2;--heading:#263239;
  --blue:#2695f3;--blue-t:rgba(38,149,243,.10);--green:#43a047;--green-t:rgba(67,160,71,.10);
  --orange:#fd7e14;--orange-t:rgba(253,126,20,.10);--purple:#673ab7;--purple-t:rgba(103,58,183,.10);
  --red:#f44539;--red-t:rgba(244,69,57,.10);--code-bg:#f7f7f7;--code-text:#263239;
  --font:'Roboto','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --r-s:3px;--r-m:5px;--r-l:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12192f;--surface:#1a2340;--surface-alt:#202a4a;--border:#2c3759;
  --text:#e6e8ee;--text-2:#a3abc2;--text-3:#6f7894;--heading:#ffffff;
  --code-bg:#121a33;--code-text:#d8e0f2;--primary-tint:rgba(36,189,176,.18);
  --blue-t:rgba(38,149,243,.2);--green-t:rgba(67,160,71,.22);--orange-t:rgba(253,126,20,.2);
  --purple-t:rgba(149,117,205,.25);--red-t:rgba(244,69,57,.22);--chrome:#0d142b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12192f;--surface:#1a2340;--surface-alt:#202a4a;--border:#2c3759;
  --text:#e6e8ee;--text-2:#a3abc2;--text-3:#6f7894;--heading:#ffffff;
  --code-bg:#121a33;--code-text:#d8e0f2;--primary-tint:rgba(36,189,176,.18);
  --blue-t:rgba(38,149,243,.2);--green-t:rgba(67,160,71,.22);--orange-t:rgba(253,126,20,.2);
  --purple-t:rgba(149,117,205,.25);--red-t:rgba(244,69,57,.22);--chrome:#0d142b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font)}
a{color:var(--primary)}
code,pre{font-family:var(--mono);font-size:12.5px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:48px;background:var(--chrome);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.top .brand{font-weight:500;font-size:16px;letter-spacing:.01em}
.top .sep{width:1px;height:20px;background:rgba(255,255,255,.3)}
.top .product{color:var(--chrome-text)}
.top .ver{margin-left:auto;font-size:12px;color:var(--chrome-muted)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 48px)}
nav.side{background:var(--chrome);color:var(--chrome-text);padding:16px 12px 32px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
nav.side input{width:100%;height:36px;border-radius:var(--r-m);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;padding:0 10px;font:400 14px var(--font);margin-bottom:12px}
nav.side input::placeholder{color:var(--chrome-muted)}
nav.side input:focus{outline:1px solid rgba(255,255,255,.8)}
nav.side .group{margin:14px 0 4px;padding:0 8px;font-size:12px;color:var(--chrome-muted)}
nav.side a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--r-m);color:var(--chrome-text);text-decoration:none;font-size:13px;line-height:1.3}
nav.side a:hover{background:rgba(255,255,255,.06)}
nav.side a.active{background:var(--primary);color:#fff}
nav.side a .m{flex:none;width:46px;font:500 10px/1 var(--mono);text-align:center;padding:3px 0;border-radius:var(--r-l);background:rgba(255,255,255,.1)}
nav.side a span.p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:24px 32px 64px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:24px;margin-bottom:16px;min-width:0}
h1{font-size:22px;font-weight:500;margin:0 0 4px;color:var(--heading);text-wrap:balance}
h2{font-size:20px;font-weight:500;margin:32px 0 12px;color:var(--heading)}
h3{font-size:16px;font-weight:500;margin:20px 0 8px;color:var(--heading)}
h4{font-size:14px;font-weight:500;margin:16px 0 6px;color:var(--text-2)}
.lead{color:var(--text-2);max-width:72ch}
.desc p{margin:0 0 8px;max-width:80ch}
.desc ul{margin:0 0 8px;padding-left:20px}
.desc code,td code,.inline{background:var(--code-bg);color:var(--code-text);padding:1px 5px;border-radius:var(--r-s)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.fact{border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px;background:var(--surface)}
.fact b{display:block;font-size:20px;font-weight:500;color:var(--heading);font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--text-2)}
.op{scroll-margin-top:64px}
.op-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--mono);padding:5px 9px;border-radius:var(--r-l)}
.GET{color:var(--blue);background:var(--blue-t)}
.POST{color:var(--green);background:var(--green-t)}
.PUT{color:var(--orange);background:var(--orange-t)}
.PATCH{color:var(--purple);background:var(--purple-t)}
.DELETE{color:var(--red);background:var(--red-t)}
nav.side a .m.GET{color:#8fc9ff}nav.side a .m.POST{color:#9fe0a3}nav.side a .m.PUT{color:#ffc08a}nav.side a .m.PATCH{color:#c9b1f0}nav.side a .m.DELETE{color:#ff9d96}
nav.side a.active .m{color:#fff;background:rgba(255,255,255,.2)}
.path{font:500 14px var(--mono);color:var(--heading);word-break:break-all}
.lock{font:500 11px/1 var(--font);color:var(--orange);background:var(--orange-t);padding:5px 9px;border-radius:var(--r-l)}
.public{font:500 11px/1 var(--font);color:var(--green);background:var(--green-t);padding:5px 9px;border-radius:var(--r-l)}
.summary{font-size:16px;font-weight:500;margin:10px 0 6px;color:var(--heading)}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-m)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--text-2);background:var(--surface-alt);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td.name{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--heading)}
td.type{font-family:var(--mono);font-size:12px;color:var(--purple);white-space:nowrap}
.req{color:var(--red);font-size:11px;margin-left:4px}
.muted{color:var(--text-2)}
.enum{font-size:12px;color:var(--text-2)}
pre{background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);border-radius:var(--r-m);padding:14px;overflow:auto;max-height:420px;margin:0}
.codehead{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
button.copy{height:28px;padding:0 10px;border-radius:var(--r-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 12px var(--font);cursor:pointer}
button.copy:hover{background:var(--surface-alt)}
button.copy:focus-visible,nav.side a:focus-visible{outline:1px solid var(--text)}
.resp{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border)}
.resp:last-child{border-bottom:none}
.code{font:500 12px var(--mono);padding:3px 8px;border-radius:var(--r-l);flex:none}
.c2{color:var(--green);background:var(--green-t)}.c4{color:var(--orange);background:var(--orange-t)}.c5{color:var(--red);background:var(--red-t)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.schema{scroll-margin-top:64px}
.hidden{display:none!important}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}nav.side{position:static;height:auto;max-height:50vh}main{padding:16px 16px 48px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header class="top"><span class="brand">OneStock</span><span class="sep"></span><span class="product">Delivery Promise API</span><span class="ver">OpenAPI 3.1.0 · v1.0.0</span></header><div class="layout"><nav class="side" id="nav" aria-label="Endpoints"></nav><main id="content"></main></div><script type="application/json" id="spec">{"openapi": "3.1.0", "info": {"title": "OneStock Delivery Promise API", "version": "1.0.0", "summary": "Delivery promise and multi-leg routing engine.", "description": "The Delivery Promise API computes realistic delivery promises for a basket and a French\ndestination. It allocates stock across stores, warehouses and last-mile hubs, builds\nphysical parcels, routes them on multi-leg, multi-carrier paths, plans consolidations at\nhubs, applies calendars, cut-offs and French public holidays, then ranks the options with\nweighted criteria.\n\n**Base URL**: `/api/v1` (same origin as the web application).\n\n**Authentication**: read endpoints and the promise / simulation endpoints are public.\nEvery write on the administration resources requires `Authorization: Bearer <ADMIN_TOKEN>`.\n\n**Errors** follow RFC 7807 (`application/problem+json`). Validation errors (422) list the\ninvalid fields in `errors[]`.\n\n**Pagination**: list endpoints accept `page` (from 1) and `pageSize` (1 to 1000, default 50)\nand return `{items, page, pageSize, total}`.\n\n**Stock consistency**: a promise is computed on a consistent snapshot of the promisable stock\n(`physical - reserved - safetyStock`) taken at the start of the request. A promise never\nreserves stock. `stats.stockVersion` identifies the snapshot.\n", "contact": {"name": "OneStock"}}, "servers": [{"url": "/api/v1", "description": "Same origin"}], "tags": [{"name": "Promise", "description": "Delivery promise computation."}, {"name": "Simulation", "description": "Basket simulation and saved scenarios."}, {"name": "Stock points", "description": "Stores, warehouses and last-mile hubs holding stock."}, {"name": "Stock", "description": "Stock lines, bulk updates and imports."}, {"name": "Catalog", "description": "Shared SKU catalog."}, {"name": "Carriers", "description": "Carriers and their services."}, {"name": "Network", "description": "Hubs, legs, explicit routes and the compiled graph."}, {"name": "Delivery modes", "description": "Commercial delivery modes, their ranking criteria, stock view and customer price."}, {"name": "Pricing", "description": "Rate cards (transport cost, customer price, carbon, custom outputs), franco and additional services."}, {"name": "Benchmarks", "description": "Load tests and their history."}, {"name": "Operations", "description": "Health, metrics, settings and calendars."}], "paths": {"/delivery-promises": {"post": {"tags": ["Promise"], "operationId": "createDeliveryPromise", "summary": "Compute delivery promises", "description": "Returns up to `maxOptions` options ranked by score. The best option of every requested mode is\nalways included, then the best option of every strategy (single source, multi-source direct,\nconsolidated), then the remaining options by score. Modes that cannot be served are listed in\n`unavailable` with a reason code (`DESTINATION_NOT_SERVED`, `NO_STOCK`, `INSUFFICIENT_STOCK`,\n`NO_FEASIBLE_PLAN`).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromiseRequest"}, "example": {"destination": {"country": "FR", "postalCode": "33000"}, "orderDate": "2026-10-12T10:00:00+02:00", "items": [{"sku": "SKU-00001", "quantity": 2}, {"sku": "SKU-00002", "quantity": 1}, {"sku": "SKU-00003", "quantity": 3}], "deliveryModes": ["STANDARD", "EXPRESS"], "maxOptions": 5}}}}, "responses": {"200": {"description": "Promise options.", "headers": {"X-Calculation-Time-Ms": {"description": "Engine computation time in milliseconds.", "schema": {"type": "number"}}, "X-Options-Count": {"description": "Number of options in the body.", "schema": {"type": "integer"}}, "X-Strategies": {"description": "Comma-separated strategies present in the options.", "schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromiseResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/simulations": {"post": {"tags": ["Simulation"], "operationId": "simulateBasket", "summary": "Simulate a basket", "description": "Same computation as `POST /delivery-promises`, enriched with node coordinates, basket stock availability and server timing for the web simulator.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromiseRequest"}}}}, "responses": {"200": {"description": "Simulation result.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SimulationResponse"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/scenarios": {"get": {"tags": ["Simulation"], "operationId": "listScenarios", "summary": "List scenarios", "parameters": [{"$ref": "#/components/parameters/page"}, {"$ref": "#/components/parameters/pageSize"}, {"$ref": "#/components/parameters/q"}], "responses": {"200": {"description": "Scenarios.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioPage"}}}}}}, "post": {"tags": ["Simulation"], "operationId": "createScenario", "summary": "Create a scenario", "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "responses": {"201": {"description": "Created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/scenarios/{id}": {"parameters": [{"$ref": "#/components/parameters/id"}], "get": {"tags": ["Simulation"], "operationId": "getScenario", "summary": "Get a scenario", "responses": {"200": {"description": "Scenario.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "put": {"tags": ["Simulation"], "operationId": "updateScenario", "summary": "Replace a scenario", "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "responses": {"200": {"description": "Updated.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Simulation"], "operationId": "deleteScenario", "summary": "Delete a scenario", "security": [{"bearerAuth": []}], "responses": {"204": {"description": "Deleted."}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/scenarios/{id}/run": {"post": {"tags": ["Simulation"], "operationId": "runScenario", "summary": "Run a scenario", "parameters": [{"$ref": "#/components/parameters/id"}], "responses": {"200": {"description": "Simulation result.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SimulationResponse"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/rate-cards": {"get": {"tags": ["Pricing"], "operationId": "listRateCards", "summary": "List rate cards", "parameters": [{"$ref": "#/components/parameters/page"}, {"$ref": "#/components/parameters/pageSize"}, {"name": "scope", "in": "query", "schema": {"type": "string", "enum": ["PARCEL", "SHIPMENT", "ORDER"]}}, {"name": "carrierId", "in": "query", "schema": {"type": "string"}}, {"$ref": "#/components/parameters/q"}], "responses": {"200": {"description": "Rate cards.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCardPage"}}}}}}, "post": {"tags": ["Pricing"], "operationId": "createRateCard", "summary": "Create a rate card", "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCard"}}}}, "responses": {"201": {"description": "Created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCard"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/rate-cards/{id}": {"parameters": [{"$ref": "#/components/parameters/id"}], "get": {"tags": ["Pricing"], "operationId": "getRateCard", "summary": "Get a rate card", "responses": {"200": {"description": "Rate card.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCard"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "put": {"tags": ["Pricing"], "operationId": "updateRateCard", "summary": "Replace a rate card", "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCard"}}}}, "responses": {"200": {"description": "Updated.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RateCard"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Pricing"], "operationId": "deleteRateCard", "summary": "Delete a rate card", "security": [{"bearerAuth": []}], "responses": {"204": {"description": "Deleted."}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/rate-cards/quote": {"post": {"tags": ["Pricing"], "operationId": "quoteInlineRateCard", "summary": "Evaluate an unsaved rate card", "description": "Test a grid before saving it. Articles are measured as one parcel (bounding box approximation); `vars` override any variable.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuoteRequest"}}}}, "responses": {"200": {"description": "Outputs.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuoteResponse"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/rate-cards/{id}/quote": {"post": {"tags": ["Pricing"], "operationId": "quoteRateCard", "summary": "Evaluate a rate card", "parameters": [{"$ref": "#/components/parameters/id"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuoteRequest"}, "example": {"items": [{"sku": "SKU-00001", "quantity": 2}], "vars": {"distanceKm": 420}, "zone": "33"}}}}, "responses": {"200": {"description": "Outputs.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuoteResponse"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/pricing/fields": {"get": {"tags": ["Pricing"], "operationId": "pricingFields", "summary": "Fields, variables and outputs usable in rules, grids and criteria", "responses": {"200": {"description": "Reference lists.", "content": {"application/json": {"schema": {"type": "object", "properties": {"articleFields": {"type": "array", "items": {"type": "string"}}, "articleAttributes": {"type": "array", "items": {"type": "string"}}, "ruleOperators": {"type": "array", "items": {"type": "string"}}, "restrictionModes": {"type": "array", "items": {"type": "string"}}, "rateVariables": {"type": "array", "items": {"type": "string"}}, "rateScopes": {"type": "array", "items": {"type": "string"}}, "outputs": {"type": "array", "items": {"type": "string"}}, "criteriaMetrics": {"type": "array", "items": {"type": "string"}}, "selections": {"type": "array", "items": {"type": "string"}}, "additionalServiceKinds": {"t     if (secured) curl += " \\\n  -H 'Authorization: Bearer $ADMIN_TOKEN'";
    if (body) curl += " \\\n  -H 'Content-Type: " + ctype + "' \\\n  --data '" + (typeof example === 'string' ? example : JSON.stringify(example)) + "'";
    html += '<section class="card op" id="' + id + '" data-search="' + esc((o.method + ' ' + o.path + ' ' + (o.op.summary || '')).toLowerCase()) + '">' +
      '<div class="op-head"><span class="badge ' + o.method + '">' + o.method + '</span><span class="path">' + esc(url) + '</span>' +
      (secured ? '<span class="lock">Admin token</span>' : '<span class="public">Public</span>') + '</div>' +
      '<div class="summary">' + esc(o.op.summary || '') + '</div><div class="desc">' + md(o.op.description) + '</div>';
    html += '<div class="cols"><div>';
    if (o.params.length) {
      html += '<h4>Parameters</h4><div class="tbl"><table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Description</th></tr></thead><tbody>' + o.params.map((p0) => {
        const p = p0.$ref ? spec.components.parameters[refName(p0.$ref)] : p0;
        return '<tr><td class="name">' + esc(p.name) + (p.required ? '<span class="req">required</span>' : '') + '</td><td>' + esc(p.in) + '</td><td class="type">' + esc(typeOf(p.schema)) + '</td><td>' + md(p.description || '') +
          (p.schema && p.schema.default !== undefined ? '<div class="enum">Default: <code>' + esc(JSON.stringify(p.schema.default)) + '</code></div>' : '') +
          (p.schema && p.schema.enum ? '<div class="enum">One of: ' + p.schema.enum.map((e) => '<code>' + esc(e) + '</code>').join(' ') + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    if (body) html += '<h4>Request body <span class="muted">(' + esc(ctype) + ')</span></h4>' + (ctype.startsWith('text/') ? '<p class="muted">' + esc(bodySchema.type || 'string') + '</p>' : propTable(bodySchema));
    html += '<h4>Responses</h4>' + Object.entries(o.op.responses || {}).map(([code, r0]) => {
      const r = r0.$ref ? spec.components.responses[refName(r0.$ref)] : r0;
      const c = r.content ? Object.values(r.content)[0] : null;
      return '<div class="resp"><span class="code c' + code[0] + '">' + esc(code) + '</span><span>' + esc(r.description || '') + (c && c.schema ? ' <code class="inline">' + esc(typeOf(c.schema)) + '</code>' : '') + '</span></div>';
    }).join('');
    html += '</div><div>';
    html += '<div class="codehead"><h4 style="margin:0">Request</h4>' + copyBtn(curl) + '</div><pre>' + esc(curl) + '</pre>';
    if (body && !ctype.startsWith('text/')) { const ex = JSON.stringify(example, null, 2); html += '<div class="codehead"><h4 style="margin:0">Body example</h4>' + copyBtn(ex) + '</div><pre>' + esc(ex) + '</pre>'; }
    const ok = Object.entries(o.op.responses || {}).find(([c]) => c.startsWith('2'));
    if (ok) {
      const r = ok[1].$ref ? spec.components.responses[refName(ok[1].$ref)] : ok[1];
      const c = r.content ? Object.values(r.content)[0] : null;
      if (c && c.schema) { const ex = JSON.stringify(c.example !== undefined ? c.example : sample(c.schema), null, 2); html += '<div class="codehead"><h4 style="margin:0">Response ' + esc(ok[0]) + '</h4></div><pre>' + esc(ex) + '</pre>'; }
    }
    html += '</div></div></section>';
  }
}
html += '<h2 id="schemas">Schemas</h2>';
for (const [name, s] of Object.entries(spec.components.schemas)) {
  if (name.endsWith('Page')) continue;
  html += '<section class="card schema" id="schema-' + esc(name) + '"><h3 style="margin-top:0">' + esc(name) + '</h3>' + (s.description ? '<div class="desc">' + md(s.description) + '</div>' : '') +
    (s.enum ? '<p>One of: ' + s.enum.map((e) => '<code class="inline">' + esc(e) + '</code>').join(' ') + '</p>' : propTable(s)) + '</section>';
}
$('#content').innerHTML = html;

// active link while scrolling
const links = [...nav.querySelectorAll('a[href^="#"]')];
const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => { if (en.isIntersecting) { links.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id)); } });
}, { rootMargin: '-60px 0px -70% 0px' });
document.querySelectorAll('section[id]').forEach((s) => io.observe(s));
</script></body></html>
