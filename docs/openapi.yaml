openapi: 3.1.0
info:
  title: OneStock Delivery Promise API
  version: 1.0.0
  summary: Delivery promise and multi-leg routing engine.
  description: |
    The Delivery Promise API computes realistic delivery promises for a basket and a French
    destination. It allocates stock across stores, warehouses and last-mile hubs, builds
    physical parcels, routes them on multi-leg, multi-carrier paths, plans consolidations at
    hubs, applies calendars, cut-offs and French public holidays, then ranks the options with
    weighted criteria.

    **Base URL**: `/api/v1` (same origin as the web application).

    **Authentication**: read endpoints and the promise / simulation endpoints are public.
    Every write on the administration resources requires `Authorization: Bearer <ADMIN_TOKEN>`.

    **Errors** follow RFC 7807 (`application/problem+json`). Validation errors (422) list the
    invalid fields in `errors[]`.

    **Pagination**: list endpoints accept `page` (from 1) and `pageSize` (1 to 1000, default 50)
    and return `{items, page, pageSize, total}`.

    **Stock consistency**: a promise is computed on a consistent snapshot of the promisable stock
    (`physical - reserved - safetyStock`) taken at the start of the request. A promise never
    reserves stock. `stats.stockVersion` identifies the snapshot.
  contact:
    name: OneStock
servers:
  - url: /api/v1
    description: Same origin
tags:
  - name: Promise
    description: Delivery promise computation.
  - name: Simulation
    description: Basket simulation and saved scenarios.
  - name: Stock points
    description: Stores, warehouses and last-mile hubs holding stock.
  - name: Stock
    description: Stock lines, bulk updates and imports.
  - name: Catalog
    description: Shared SKU catalog.
  - name: Carriers
    description: Carriers and their services.
  - name: Network
    description: Hubs, legs, explicit routes and the compiled graph.
  - name: Delivery modes
    description: Commercial delivery modes, their ranking criteria, stock view and customer price.
  - name: Pricing
    description: Rate cards (transport cost, customer price, carbon, custom outputs), franco and additional services.
  - name: Benchmarks
    description: Load tests and their history.
  - name: Operations
    description: Health, metrics, settings and calendars.
paths:
  /delivery-promises:
    post:
      tags: [Promise]
      operationId: createDeliveryPromise
      summary: Compute delivery promises
      description: |
        Returns up to `maxOptions` options ranked by score. The best option of every requested mode is
        always included, then the best option of every strategy (single source, multi-source direct,
        consolidated), then the remaining options by score. Modes that cannot be served are listed in
        `unavailable` with a reason code (`DESTINATION_NOT_SERVED`, `NO_STOCK`, `INSUFFICIENT_STOCK`,
        `NO_FEASIBLE_PLAN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromiseRequest' }
            example:
              destination: { country: FR, postalCode: '33000' }
              orderDate: '2026-10-12T10:00:00+02:00'
              items:
                - { sku: SKU-00001, quantity: 2 }
                - { sku: SKU-00002, quantity: 1 }
                - { sku: SKU-00003, quantity: 3 }
              deliveryModes: [STANDARD, EXPRESS]
              maxOptions: 5
      responses:
        '200':
          description: Promise options.
          headers:
            X-Calculation-Time-Ms:
              description: Engine computation time in milliseconds.
              schema: { type: number }
            X-Options-Count:
              description: Number of options in the body.
              schema: { type: integer }
            X-Strategies:
              description: Comma-separated strategies present in the options.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromiseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /simulations:
    post:
      tags: [Simulation]
      operationId: simulateBasket
      summary: Simulate a basket
      description: Same computation as `POST /delivery-promises`, enriched with node coordinates, basket stock availability and server timing for the web simulator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromiseRequest' }
      responses:
        '200':
          description: Simulation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /scenarios:
    get:
      tags: [Simulation]
      operationId: listScenarios
      summary: List scenarios
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/q' }]
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioPage' }
    post:
      tags: [Simulation]
      operationId: createScenario
      summary: Create a scenario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Scenario' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /scenarios/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Simulation]
      operationId: getScenario
      summary: Get a scenario
      responses:
        '200': { description: Scenario., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Simulation]
      operationId: updateScenario
      summary: Replace a scenario
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Simulation]
      operationId: deleteScenario
      summary: Delete a scenario
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{id}/run:
    post:
      tags: [Simulation]
      operationId: runScenario
      summary: Run a scenario
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Simulation result., content: { application/json: { schema: { $ref: '#/components/schemas/SimulationResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /rate-cards:
    get:
      tags: [Pricing]
      operationId: listRateCards
      summary: List rate cards
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: scope, in: query, schema: { type: string, enum: [PARCEL, SHIPMENT, ORDER] } }, { name: carrierId, in: query, schema: { type: string } }, { $ref: '#/components/parameters/q' }]
      responses:
        '200': { description: Rate cards., content: { application/json: { schema: { $ref: '#/components/schemas/RateCardPage' } } } }
    post:
      tags: [Pricing]
      operationId: createRateCard
      summary: Create a rate card
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /rate-cards/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Pricing]
      operationId: getRateCard
      summary: Get a rate card
      responses:
        '200': { description: Rate card., content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pricing]
      operationId: updateRateCard
      summary: Replace a rate card
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pricing]
      operationId: deleteRateCard
      summary: Delete a rate card
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rate-cards/quote:
    post:
      tags: [Pricing]
      operationId: quoteInlineRateCard
      summary: Evaluate an unsaved rate card
      description: Test a grid before saving it. Articles are measured as one parcel (bounding box approximation); `vars` override any variable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } } }
      responses:
        '200': { description: Outputs., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /rate-cards/{id}/quote:
    post:
      tags: [Pricing]
      operationId: quoteRateCard
      summary: Evaluate a rate card
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
            example: { items: [{ sku: SKU-00001, quantity: 2 }], vars: { distanceKm: 420 }, zone: '33' }
      responses:
        '200': { description: Outputs., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /pricing/fields:
    get:
      tags: [Pricing]
      operationId: pricingFields
      summary: Fields, variables and outputs usable in rules, grids and criteria
      responses:
        '200':
          description: Reference lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  articleFields: { type: array, items: { type: string } }
                  articleAttributes: { type: array, items: { type: string } }
                  ruleOperators: { type: array, items: { type: string } }
                  restrictionModes: { type: array, items: { type: string } }
                  rateVariables: { type: array, items: { type: string } }
                  rateScopes: { type: array, items: { type: string } }
                  outputs: { type: array, items: { type: string } }
                  criteriaMetrics: { type: array, items: { type: string } }
                  selections: { type: array, items: { type: string } }
                  additionalServiceKinds: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string }, description: Rate cards ignored because they do not compile. }
  /additional-services:
    get:
      tags: [Pricing]
      operationId: listAdditionalServices
      summary: List additional services
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }]
      responses:
        '200': { description: Additional services., content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalServicePage' } } } }
    post:
      tags: [Pricing]
      operationId: createAdditionalService
      summary: Create a additional service
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalService' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalService' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /additional-services/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Pricing]
      operationId: getAdditionalService
      summary: Get a additional service
      responses:
        '200': { description: Additional service., content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalService' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pricing]
      operationId: updateAdditionalService
      summary: Replace a additional service
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalService' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdditionalService' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pricing]
      operationId: deleteAdditionalService
      summary: Delete a additional service
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-views:
    get:
      tags: [Stock]
      operationId: listStockViews
      summary: List stock views
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }]
      responses:
        '200': { description: Stock views., content: { application/json: { schema: { $ref: '#/components/schemas/StockViewPage' } } } }
    post:
      tags: [Stock]
      operationId: createStockView
      summary: Create a stock view
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockView' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/StockView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stock-views/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Stock]
      operationId: getStockView
      summary: Get a stock view
      responses:
        '200': { description: Stock view., content: { application/json: { schema: { $ref: '#/components/schemas/StockView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      operationId: updateStockView
      summary: Replace a stock view
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockView' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/StockView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Stock]
      operationId: deleteStockView
      summary: Delete a stock view
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-views/{id}/preview:
    get:
      tags: [Stock]
      operationId: previewStockView
      summary: Stock points and articles selected by a view
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  stockPoints: { type: integer }
                  pointIds: { type: array, items: { type: string } }
                  skus: { type: integer }
                  reserve: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/database:
    get:
      tags: [Operations]
      operationId: databaseStatus
      summary: Database status
      description: Persistence mode, seed, stock storage (delta or full) and number of stored stock rows.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Status. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-points:
    get:
      tags: [Stock points]
      operationId: listStockPoints
      summary: List stock points
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/q' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockPointType' } }
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200': { description: Stock points., content: { application/json: { schema: { $ref: '#/components/schemas/StockPointPage' } } } }
    post:
      tags: [Stock points]
      operationId: createStockPoint
      summary: Create a stock point
      description: Adds a column to the stock matrix (all SKUs unlisted until stock is imported).
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stock-points/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Stock points]
      operationId: getStockPoint
      summary: Get a stock point
      responses:
        '200': { description: Stock point., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock points]
      operationId: updateStockPoint
      summary: Replace a stock point
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Stock points]
      operationId: deleteStockPoint
      summary: Delete a stock point
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/stock:
    get:
      tags: [Stock points]
      operationId: listStockPointStock
      summary: List the stock of a point
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sku, in: query, schema: { type: string } }
        - { name: onlyAvailable, in: query, schema: { type: boolean }, description: Only lines with promisable stock. }
        - { name: all, in: query, schema: { type: boolean }, description: Include unlisted SKUs. }
      responses:
        '200': { description: Stock lines., content: { application/json: { schema: { $ref: '#/components/schemas/StockLinePage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/summary:
    get:
      tags: [Stock points]
      operationId: getStockPointSummary
      summary: Stock summary of a point
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/StockSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/connections:
    get:
      tags: [Stock points]
      operationId: getStockPointConnections
      summary: Legs leaving and reaching a node
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outgoing: { type: array, items: { $ref: '#/components/schemas/Leg' } }
                  incoming: { type: array, items: { $ref: '#/components/schemas/Leg' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /stock:
    get:
      tags: [Stock]
      operationId: listStock
      summary: Query stock lines
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: stockPointId, in: query, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: onlyAvailable, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Stock lines., content: { application/json: { schema: { $ref: '#/components/schemas/StockLinePage' } } } }
    patch:
      tags: [Stock]
      operationId: patchStock
      summary: Apply a batch of stock updates
      description: |
        Applied atomically with respect to promise computations (one write lock, one stock version).
        Invalid lines are reported and skipped. `delta` adjusts the physical quantity relatively.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/StockUpdate' } }
            example:
              - { stockPointId: STORE-001, sku: SKU-00001, physical: 12, reserved: 1 }
              - { stockPointId: WH-01, sku: SKU-00002, delta: -3 }
      responses:
        '200': { description: Batch result., content: { application/json: { schema: { $ref: '#/components/schemas/StockBatchResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock/import:
    post:
      tags: [Stock]
      operationId: importStock
      summary: Bulk import stock
      description: |
        Accepts `text/csv` (`stockPointId,sku,physical[,reserved]`, optional header line) or a JSON array of
        stock updates. Up to 2,000,000 lines and 128 MB per call. Incremental: the availability bitmaps are
        updated line by line, no index rebuild.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "stockPointId,sku,physical,reserved\nSTORE-001,SKU-00001,4,0\nWH-01,SKU-00002,120,10\n"
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/StockUpdate' } }
      responses:
        '200': { description: Import result., content: { application/json: { schema: { $ref: '#/components/schemas/StockBatchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock/{stockPointId}/{sku}:
    parameters:
      - { name: stockPointId, in: path, required: true, schema: { type: string } }
      - { name: sku, in: path, required: true, schema: { type: string } }
    get:
      tags: [Stock]
      operationId: getStockLine
      summary: Get a stock line
      responses:
        '200': { description: Stock line., content: { application/json: { schema: { $ref: '#/components/schemas/StockLine' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      operationId: putStockLine
      summary: Set a stock line
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physical]
              properties:
                physical: { type: integer, minimum: 0 }
                reserved: { type: integer, minimum: 0 }
                listed: { type: boolean, default: true }
      responses:
        '200': { description: Stock line., content: { application/json: { schema: { $ref: '#/components/schemas/StockLine' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /skus:
    get:
      tags: [Catalog]
      operationId: listSkus
      summary: Search the catalog
