    post:
      tags: [Benchmarks]
      operationId: startBenchmark
      summary: Start a benchmark
      description: |
        Starts a built-in load test on varied generated baskets. Returns 202 immediately with the run; poll
        `GET /benchmarks/{id}`. With `?wait=true` (forced on Vercel, capped at 25 s) the call blocks and returns 200.
        Only one run at a time (409 otherwise).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: wait, in: query, schema: { type: boolean } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkConfig' } } } }
      responses:
        '200': { description: Finished run (wait mode)., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '202': { description: Run started., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /benchmarks/presets:
    get:
      tags: [Benchmarks]
      operationId: listBenchmarkPresets
      summary: Predefined load profiles
      responses:
        '200': { description: Presets., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BenchmarkConfig' } } } } }
  /benchmarks/baskets:
    get:
      tags: [Benchmarks]
      operationId: generateBenchmarkBaskets
      summary: Generate a basket pool
      description: Reproducible pool of varied baskets used by k6 (`setup()`) and the built-in runner. Multi-source baskets are verified against the stock.
      parameters:
        - { name: count, in: query, schema: { type: integer, default: 1000, maximum: 20000 } }
        - { name: seed, in: query, schema: { type: integer, default: 1 } }
        - { name: skusMin, in: query, schema: { type: integer, default: 2 } }
        - { name: skusMax, in: query, schema: { type: integer, default: 5 } }
        - { name: qtyMin, in: query, schema: { type: integer, default: 1 } }
        - { name: qtyMax, in: query, schema: { type: integer, default: 2 } }
        - { name: pctMono, in: query, schema: { type: number, default: 30 } }
        - { name: pctMulti, in: query, schema: { type: number, default: 40 } }
        - { name: pctMultiSource, in: query, schema: { type: number, default: 20 } }
        - { name: pctConsolidation, in: query, schema: { type: number, default: 10 } }
        - { name: postalCodes, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: modes, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: spread, in: query, schema: { type: boolean }, description: Spread order dates over a week. }
      responses:
        '200':
          description: Baskets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string, enum: [mono, multi, multi-source, consolidation] }
                    request: { $ref: '#/components/schemas/PromiseRequest' }
  /benchmarks/import:
    post:
      tags: [Benchmarks]
      operationId: importBenchmark
      summary: Import an external run (k6)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
      responses:
        '201': { description: Imported., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /benchmarks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Benchmarks]
      operationId: getBenchmark
      summary: Get a run with its time series
      responses:
        '200': { description: Run., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Benchmarks]
      operationId: deleteBenchmark
      summary: Delete a finished run
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /benchmarks/{id}/stop:
    post:
      tags: [Benchmarks]
      operationId: stopBenchmark
      summary: Stop a running benchmark
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '202': { description: Stopping. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Health check
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  seed: { type: integer }
                  platform: { type: string, example: vercel }
                  persistence: { type: boolean }
                  persistError: { type: string }
                  stockLines: { type: integer }
                  uptimeSec: { type: number }
  /dashboard:
    get:
      tags: [Operations]
      operationId: dashboard
      summary: Dashboard data
      description: Counts, live latency of the promise API (ring buffer of the last 20,000 requests of this instance), route cache hit rate, process resources and last benchmark.
      responses:
        '200': { description: Dashboard., content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Live metrics
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  promise: { $ref: '#/components/schemas/LatencySnapshot' }
                  api: { $ref: '#/components/schemas/LatencySnapshot' }
                  system: { $ref: '#/components/schemas/System' }
  /metrics/reset:
    post:
      tags: [Operations]
      operationId: resetMetrics
      summary: Reset live metrics
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Reset. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings:
    get:
      tags: [Operations]
      operationId: getSettings
      summary: Engine settings
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
    put:
      tags: [Operations]
      operationId: putSettings
      summary: Update engine settings
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /calendar/holidays:
    get:
      tags: [Operations]
      operationId: listHolidays
      summary: French public holidays
      parameters: [{ name: year, in: query, schema: { type: integer, example: 2026 } }]
      responses:
        '200':
          description: Holidays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  holidays:
                    type: array
                    items: { type: object, properties: { date: { type: string, format: date }, name: { type: string } } }
  /admin/reseed:
    post:
      tags: [Operations]
      operationId: reseed
      summary: Regenerate the dataset
      description: Rebuilds the full reference dataset (120 stock points, 1.2M stock lines) from a seed and swaps it atomically. With PostgreSQL, the database is replaced too.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seed]
              properties:
                seed: { type: integer, example: 42 }
                stockStorage: { type: string, enum: [delta, full], description: 'delta: only changed stock lines are stored (default); full: all 1.2M lines' }
      responses:
        '200': { description: Regenerated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/check:
    get:
      tags: [Operations]
      operationId: checkAuth
      summary: Check the admin token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token valid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openapi.json:
    get:
      tags: [Operations]
      operationId: openapi
      summary: This OpenAPI document
      responses:
        '200': { description: OpenAPI 3.1 document. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Admin token (`ADMIN_TOKEN` environment variable).
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
    q: { name: q, in: query, description: Case-insensitive search., schema: { type: string } }
  responses:
    BadRequest:
      description: Malformed request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing or invalid admin token.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Already exists or already running.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Invalid fields.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://dp100ms.onestock.dev/problems/validation-error
            title: Unprocessable Entity
            status: 422
            detail: the request contains invalid fields
            instance: /api/v1/delivery-promises
            errors:
              - { field: destination.postalCode, message: postal code must have 5 digits }
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    TimeOfDay: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$', example: '17:30', description: Local wall-clock time (Europe/Paris). }
    Calendar:
      type: object
      required: [workingDays]
      properties:
        workingDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: '1 = Monday … 7 = Sunday', example: [1, 2, 3, 4, 5] }
        honorHolidays: { type: boolean, description: Skip French public holidays. }
        closedDates: { type: array, items: { type: string, format: date } }
    StockPointType: { type: string, enum: [STORE, WAREHOUSE, LAST_MILE_HUB] }
    StockPoint:
      type: object
      required: [id, name, type, address, lat, lon, openingTime, closingTime, prepCalendar]
      properties:
        id: { type: string, example: STORE-001 }
        name: { type: string, example: Magasin Paris 1 }
        type: { $ref: '#/components/schemas/StockPointType' }
        address:
          type: object
          properties:
            line1: { type: string }
            postalCode: { type: string, pattern: '^[0-9]{5}$' }
            city: { type: string }
            country: { type: string, default: FR }
        lat: { type: number }
        lon: { type: number }
        timezone: { type: string, default: Europe/Paris }
        openingTime: { $ref: '#/components/schemas/TimeOfDay' }
        closingTime: { $ref: '#/components/schemas/TimeOfDay' }
        prepCalendar: { $ref: '#/components/schemas/Calendar' }
        prepTimeMinutes: { type: integer, minimum: 0 }
        cutoff: { $ref: '#/components/schemas/TimeOfDay' }
        dailyCapacity: { type: integer }
        safetyStock: { type: integer, minimum: 0, description: Units kept back from the promisable quantity of every SKU. }
        allowedModes: { type: array, items: { type: string } }
        prepCostPerParcel: { type: number }
        active: { type: boolean }
    Carrier:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: COLIVIA }
        name: { type: string, example: Colivia }
        active: { type: boolean }
        rateCardIds: { type: array, items: { type: string }, description: 'Default cost grids of every service of the carrier (priority: leg > schedule > service > carrier).' }
        schedules: { type: array, items: { $ref: '#/components/schemas/DeliverySchedule' } }
        restrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' }, description: Article restrictions applied to every service and route of the carrier. }
        logoUrl: { type: string }
    Zone:
      type: object
      required: [id, name]
      description: Named set of places used as origin or destination of carrier routes. A place belongs to the zone when it matches any department ("*" = metropolitan France), postal code prefix or stock point.
      properties:
        id: { type: string, example: FR }
        name: { type: string, example: France métropolitaine }
        description: { type: string }
        departments: { type: array, items: { type: string }, example: ['*'] }
        excludedDepartments: { type: array, items: { type: string }, example: ['20'] }
        postalCodes: { type: array, items: { type: string }, example: ['750', '69001'] }
        stockPointIds: { type: array, items: { type: string } }
        active: { type: boolean }
    ZonePage: { $ref: '#/components/schemas/_Page', x-items: Zone }
    RouteDay:
      type: object
      required: [weekday]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday … 7 = Sunday. }
        pickups: { type: array, items: { $ref: '#/components/schemas/TimeOfDay' }, description: Pickup times at the origin (none = no pickup that day). }
        deliveryStart: { $ref: '#/components/schemas/TimeOfDay' }
        deliveryEnd: { $ref: '#/components/schemas/TimeOfDay' }
    RoutePlanning:
      type: object
      required: [days]
      properties:
        timezone: { type: string, example: Europe/Paris, description: Only the deployment time zone is supported. }
        days: { type: array, items: { $ref: '#/components/schemas/RouteDay' } }
        honorHolidays: { type: boolean }
        closedDates: { type: array, items: { type: string, format: date } }
    CarrierRoute:
      type: object
      required: [id, carrierId, serviceId, originZoneId, destinationZoneId]
      description: |
        Delivery route of a carrier service from an origin zone to a destination zone. For a service delivering the
        customer, routes are the source of truth: every stock point of the origin zone can ship with the service to
        the destination zone (explicit customer legs of the service are replaced). Cost grid (transport cost,
        shipping fees, carbon, custom outputs), transit time in hours, weekly planning (pickups and delivery slots),
        article restrictions and metadata. A route is the last layer of a leg planning (after the carrier schedules).
        When several routes match, the highest priority wins, then the destination zone naming the department, then
        the smallest zone.
      properties:
        id: { type: string, example: FEDEX-STD-FR-FR }
        carrierId: { type: string }
        serviceId: { type: string }
        name: { type: string }
        originZoneId: { type: string }
        destinationZoneId: { type: string }
        costs: { $ref: '#/components/schemas/RateCard' }
        transitMinHours: { type: integer, minimum: 0 }
        transitMaxHours: { type: integer, minimum: 0, description: 0 keeps the transit of the service (delivery days). }
        planning: { $ref: '#/components/schemas/RoutePlanning' }
        restrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        metadata: { type: object, additionalProperties: { type: string } }
        priority: { type: integer }
        active: { type: boolean }
    CarrierRoutePage: { $ref: '#/components/schemas/_Page', x-items: CarrierRoute }
    DeliverySchedule:
      type: object
      required: [name]
      description: |
        Carrier delivery planning. Schedules are layered on the service values from the most general to the most
        specific: carrier-wide (no services, no zones), service, zone, service + zone. Each layer only overrides the
        fields it sets. Zones apply to legs delivering the customer. The cut-off caps the pickup times of the legs.
      properties:
        id: { type: string, example: COLIVIA-CORSE, description: Generated from the carrier id when empty. }
        name: { type: string, example: Corse J+4 }
        serviceIds: { type: array, items: { type: string } }
        zones: { type: array, items: { type: string }, example: ['20'] }
        pickupDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        cutoff: { $ref: '#/components/schemas/TimeOfDay' }
        deliveryDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        transitDays: { type: integer, minimum: 0, maximum: 30 }
        windowStart: { $ref: '#/components/schemas/TimeOfDay' }
        windowEnd: { $ref: '#/components/schemas/TimeOfDay' }
        honorHolidays: { type: boolean }
        closedDates: { type: array, items: { type: string, format: date } }
        rateCardIds: { type: array, items: { type: string } }
        active: { type: boolean }
    ServiceKind: { type: string, enum: [STANDARD, EXPRESS, SAME_DAY, HOME, RELAY, STORE_DELIVERY, LAST_MILE, LINEHAUL, SHUTTLE] }
    CarrierService:
      type: object
      required: [id, carrierId, name, kind, pickupCalendar, deliveryCalendar]
      properties:
        id: { type: string, example: COLIVIA-STD }
        carrierId: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ServiceKind' }
        modes: { type: array, items: { type: string }, description: Delivery modes this service fulfils as a final leg. }
        coverage: { type: array, items: { type: string }, description: 'Department codes, or "*" for metropolitan France ("20" = Corsica).' }
        excludedCoverage: { type: array, items: { type: string } }
        servedPostalCodes: { type: array, items: { type: string }, description: Optional postal code prefixes restricting coverage. }
        transitDays: { type: integer, description: Final-leg transit in delivery working days (0 = same day). }
        transitMinutes: { type: integer, description: Transit of hub-bound legs. }
        pickupCalendar: { $ref: '#/components/schemas/Calendar' }
        deliveryCalendar: { $ref: '#/components/schemas/Calendar' }
        cutoff: { $ref: '#/components/schemas/TimeOfDay' }
        windowStart: { $ref: '#/components/schemas/TimeOfDay' }
        windowEnd: { $ref: '#/components/schemas/TimeOfDay' }
        maxWeightKg: { type: number }
        maxVolumeL: { type: number }
        maxItems: { type: integer }
        dailyCapacity: { type: integer }
        baseCost: { type: number, description: 'Cost per parcel (EUR), used when no rate card produces a cost.' }
        costPerKg: { type: number }
        rateCardIds: { type: array, items: { type: string }, description: PARCEL / SHIPMENT rate cards pricing the parcels carried. }
        carbonGramsPerKgKm: { type: number, description: Fallback emission factor when no rate card produces carbonKg. }
        restrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        additionalServiceIds: { type: array, items: { type: string }, description: Services offered when this service delivers the customer. }
        active: { type: boolean }
    Unavailability:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        reason: { type: string }
    Hub:
      type: object
      required: [id, name, kind, calendar]
      properties:
        id: { type: string, example: HUB-IDF }
        name: { type: string }
        kind: { type: string, enum: [CONSOLIDATION, LAST_MILE] }
        stockPointId: { type: string, description: Set when the hub is also a stock point (same id). }
        postalCode: { type: string }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }
        calendar: { $ref: '#/components/schemas/Calendar' }
        openingTime: { $ref: '#/components/schemas/TimeOfDay' }
        closingTime: { $ref: '#/components/schemas/TimeOfDay' }
        sortingMinutes: { type: integer }
        consolidationEnabled: { type: boolean }
        consolidationMinutes: { type: integer }
        maxConsolidationWaitHours: { type: integer, description: Max wait between the first and the last component (0 = unbounded). }
        consolidationCost: { type: number }
        unavailability: { type: array, items: { $ref: '#/components/schemas/Unavailability' } }
        active: { type: boolean }
    Leg:
      type: object
      required: [id, from, to, carrierId, serviceId]
      properties:
        id: { type: string, example: LEG-0001 }
        from: { type: string }
        to: { type: string, description: Hub id or CUSTOMER. }
        carrierId: { type: string }
        serviceId: { type: string }
        destinationZones: { type: array, items: { type: string } }
        departures: { type: array, items: { $ref: '#/components/schemas/TimeOfDay' } }
        cutoffMinutesBefore: { type: integer }
        calendar: { $ref: '#/components/schemas/Calendar' }
        transitMinutes: { type: integer }
        extraCost: { type: number }
        maxWeightKg: { type: number }
        modes: { type: array, items: { type: string } }
        rateCardIds: { type: array, items: { type: string }, description: Override of the service rate cards for this route segment. }
        restrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        active: { type: boolean }
    Route:
      type: object
      required: [id, name, legIds]
      properties:
        id: { type: string }
        name: { type: string }
        legIds: { type: array, items: { type: string } }
        modes: { type: array, items: { type: string } }
        description: { type: string }
        active: { type: boolean }
    DeliveryMode:
      type: object
      required: [id, name, maxLegs, maxSources]
      properties:
        id: { type: string, example: EXPRESS }
        name: { type: string }
        description: { type: string }
        maxLegs: { type: integer, minimum: 1, maximum: 5 }
        maxSources: { type: integer, minimum: 1, maximum: 6 }
        allowConsolidation: { type: boolean }
        allowSplit: { type: boolean, description: Allow one SKU to be split across several sources. }
        maxDeliveryDays: { type: integer, description: Max business days between order and delivery. }
        price: { type: number, description: Customer price when no price rate card is set. }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' }, description: Rank the options and pick each shipment's route. }
        selection: { type: string, enum: [WEIGHTED, LEXICOGRAPHIC] }
        stockViewId: { type: string }
        priceRateCardIds: { type: array, items: { type: string }, description: ORDER-scope cards computing the price billed to the customer (franco). }
        serviceIds: { type: array, items: { type: string }, description: 'Carrier services compared for this mode (the engine keeps the best route). Empty = the services listing the mode in their own modes.' }
        operations: { type: array, items: { $ref: '#/components/schemas/ModeOperation' } }
        active: { type: boolean }
    ModeOperation:
      type: object
      required: [kind, minutes]
      description: |
        Timed operation of a delivery mode. PAYMENT and VALIDATION delay the start of preparation (elapsed time);
        PREPARATION replaces the preparation time of the stock points and PACKING adds to it (working hours);
        RECEPTION delays the delivery slot (e.g. reception at the pick-up point).
      properties:
        kind: { type: string, enum: [PAYMENT, VALIDATION, PREPARATION, PACKING, RECEPTION] }
        name: { type: string, example: Autorisation de paiement }
        minutes: { type: integer, minimum: 0, maximum: 20160 }
    Sku:
      type: object
      properties:
        sku: { type: string, example: SKU-00001 }
        name: { type: string }
        category: { type: string }
        weightKg: { type: number }
        volumeL: { type: number }
        lengthCm: { type: number }
        widthCm: { type: number }
        heightCm: { type: number }
        priceEur: { type: number }
        attributes: { type: object, additionalProperties: true, example: { fragile: true, hazmat: UN1266 } }
    StockLine:
      type: object
      properties:
        stockPointId: { type: string }
        sku: { type: string }
        physical: { type: integer }
        reserved: { type: integer }
        available: { type: integer, description: physical - reserved }
        promisable: { type: integer, description: available - safetyStock (0 when unlisted) }
        listed: { type: boolean }
    StockUpdate:
      type: object
      required: [stockPointId, sku]
      properties:
        stockPointId: { type: string }
        sku: { type: string }
        physical: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        delta: { type: integer }
        listed: { type: boolean }
    StockBatchResult:
      type: object
      properties:
        applied: { type: integer }
        rejected: { type: integer }
        errors: { type: array, items: { type: object, properties: { index: { type: integer }, reason: { type: string } } } }
        stockVersion: { type: integer }
        durationMs: { type: number }
    StockSummary:
      type: object
      properties:
        lines: { type: integer }
        listed: { type: integer }
        availableSkus: { type: integer }
        outOfStockSkus: { type: integer }
        totalUnits: { type: integer }
        reservedUnits: { type: integer }
    Scenario:
      type: object
      required: [id, name, request]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        request: { $ref: '#/components/schemas/PromiseRequest' }
        createdAt: { type: string, format: date-time }
    BasketItem:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string, example: SKU-00001 }
        quantity: { type: integer, minimum: 1 }
    ScoringWeights:
      type: object
      description: Relative weights (normalised) of the ranking criteria.
      properties:
        deliveryTime: { type: number, minimum: 0, example: 0.45 }
        packages: { type: number, minimum: 0, example: 0.2 }
        cost: { type: number, minimum: 0, example: 0.2 }
        legs: { type: number, minimum: 0, example: 0.05 }
        sources: { type: number, minimum: 0, example: 0.1 }
    PromiseRequest:
      type: object
      required: [destination, orderDate, items]
      properties:
        destination:
          type: object
          required: [postalCode]
          properties:
            country: { type: string, enum: [FR], default: FR }
            postalCode: { type: string, pattern: '^[0-9]{5}$', example: '33000' }
        orderDate: { type: string, format: date-time, example: '2026-10-12T10:00:00+02:00' }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/BasketItem' }, description: Duplicated SKUs are merged; at most 500 units. }
        deliveryModes: { type: array, items: { type: string }, description: Defaults to every active mode. }
        maxOptions: { type: integer, minimum: 1, maximum: 50, default: 5 }
        constraints:
          type: object
          properties:
            maxPackages: { type: integer }
            maxWeightKg: { type: number, description: Max weight per package. }
            maxItems: { type: integer, description: Max units per package. }
            forbidConsolidation: { type: boolean }
            maxSources: { type: integer }
        weights: { $ref: '#/components/schemas/ScoringWeights' }
        stockViewId: { type: string, description: Overrides the stock view of the modes. }
        additionalServices: { type: array, items: { type: string }, example: [INSTALLATION], description: Requested services; options whose delivering carrier cannot provide them are removed. }
        orderAmount: { type: number, description: 'Order amount for franco and percentage rules (default: Σ article price × quantity).' }
        alternatives:
          type: object
          description: Ask, for every package, the other stock points able to ship it.
          properties:
            limit: { type: integer, default: 5, maximum: 20 }
            sortBy: { type: string, default: deliveryHours, description: 'deliveryHours, distanceKm, cost, carbonKg or a custom output' }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' }, description: Override of the mode criteria. }
        selection: { type: string, enum: [WEIGHTED, LEXICOGRAPHIC] }
        debug: { type: boolean }
    TimeWindow:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    ModeBest:
      type: object
      description: Best delivery route of a delivery mode (its first option).
      properties:
        deliveryMode: { type: string }
        optionId: { type: string, description: Option in `options` (empty when maxOptions is lower than the number of modes). }
        strategy: { type: string }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
        leadTimeHours: { type: number }
        cost: { type: number, description: Transport, preparation and consolidation cost. }
        price: { type: number, description: Amount billed to the customer. }
        carbonKg: { type: number }
        currency: { type: string }
        packages: { type: integer }
        carriers:
          type: array
          items:
            type: object
            properties:
              carrierId: { type: string }
              carrierName: { type: string }
              serviceId: { type: string }
              serviceName: { type: string }
              routeIds: { type: array, items: { type: string } }
              packages: { type: integer }
        shippingPoints: { type: array, items: { type: string } }
        alternativeShippingPoints: { type: array, items: { type: string }, description: Other stock points able to ship a package (requires `alternatives`). }
    LegResult:
      type: object
      properties:
        legId: { type: string, description: 'Direct legs generated by carrier routes are named RT-<service>-<stock point>.' }
        from: { type: string }
        to: { type: string }
        carrier: { type: string }
        carrierName: { type: string }
        service: { type: string }
        serviceName: { type: string }
        routeId: { type: string, description: Carrier route applied to the leg. }
        serviceKind: { $ref: '#/components/schemas/ServiceKind' }
        estimatedDeparture: { type: string, format: date-time }
        estimatedArrival: { type: string, format: date-time, description: For the final leg, end of the delivery window. }
        cost: { type: number }
        distanceKm: { type: number }
        metrics: { type: object, additionalProperties: { type: number }, description: Outputs of this leg (cost, carbonKg, custom). }
    PackageResult:
      type: object
      description: A physical parcel delivered to the customer.
      properties:
        packageId: { type: string, example: PKG-001 }
        items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
        sourceStockPoints: { type: array, items: { type: string } }
        weightKg: { type: number }
        volumeL: { type: number }
        route: { type: array, items: { $ref: '#/components/schemas/LegResult' }, description: Inbound legs of every contributing source (consolidated parcels), then the parcel's own legs. }
        hubs: { type: array, items: { type: string } }
        consolidationId: { type: string }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
        leadTimeHours: { type: number }
        distanceKm: { type: number }
        metrics: { type: object, additionalProperties: { type: number }, description: 'Share of the option outputs carried by this parcel (cost, price, carbonKg…).' }
        alternatives: { type: array, items: { $ref: '#/components/schemas/PackageAlternative' } }
    PromiseOption:
      type: object
      properties:
        id: { type: string }
        deliveryMode: { type: string }
        strategy: { type: string, enum: [SINGLE_SOURCE, MULTI_SOURCE_DIRECT, CONSOLIDATED] }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
        totalPackages: { type: integer, description: Parcels delivered to the customer. }
        packagesBeforeConsolidation: { type: integer, description: Parcels leaving the stock points. }
        totalCost: { type: number }
        currency: { type: string, example: EUR }
        packages: { type: array, items: { $ref: '#/components/schemas/PackageResult' } }
        allocations:
          type: array
          items: { type: object, properties: { stockPointId: { type: string }, sku: { type: string }, quantity: { type: integer } } }
        preparationGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              stockPointId: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
              readyAt: { type: string, format: date-time }
              parcels: { type: integer }
        shipments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              packageId: { type: string }
              kind: { type: string, enum: [DIRECT, INBOUND, OUTBOUND] }
              origin: { type: string }
              destination: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
              legs: { type: array, items: { $ref: '#/components/schemas/LegResult' } }
        consolidations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              hubId: { type: string }
              hubName: { type: string }
              inboundShipments: { type: array, items: { type: string } }
              lastArrival: { type: string, format: date-time }
              readyAt: { type: string, format: date-time }
              outboundPackages: { type: array, items: { type: string } }
              cost: { type: number }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              type: { type: string, enum: [ORDER, PREPARATION_READY, DEPARTURE, ARRIVAL, CONSOLIDATION_READY, DELIVERY] }
              node: { type: string }
              packageId: { type: string }
              description: { type: string }
        metrics: { type: object, additionalProperties: { type: number }, description: 'Totals: cost (transport + preparation + consolidation + services), price (billed to the customer), carbonKg, custom outputs.' }
        additionalServices: { type: array, items: { $ref: '#/components/schemas/AdditionalServiceResult' } }
        stockViewId: { type: string }
        criteria:
          type: object
          properties:
            price: { type: number }
            carbonKg: { type: number }
            deliveryHours: { type: number }
            packages: { type: integer }
            cost: { type: number }
            legs: { type: integer }
            sources: { type: integer }
        score: { type: number, minimum: 0, maximum: 1, description: '1 - weighted min-max normalised penalty within the mode.' }
    PromiseResponse:
      type: object
      properties:
        requestId: { type: string }
        bestByMode: { type: array, items: { $ref: '#/components/schemas/ModeBest' }, description: Best delivery route of every requested mode that can be served. }
        options: { type: array, items: { $ref: '#/components/schemas/PromiseOption' } }
        unavailable:
          type: array
          items:
            type: object
            properties:
              deliveryMode: { type: string }
              code: { type: string, enum: [DESTINATION_NOT_SERVED, NO_STOCK, INSUFFICIENT_STOCK, NO_FEASIBLE_PLAN] }
              reason: { type: string }
        calculationTimeMs: { type: number, description: Engine time (excludes HTTP and JSON). }
        stats:
          type: object
          properties:
            candidateStockPoints: { type: integer }
            allocations: { type: integer }
            plansEvaluated: { type: integer }
            pathsConsidered: { type: integer }
            hubsPruned: { type: integer, description: Consolidation hubs skipped by branch and bound. }
            routeCacheHit: { type: boolean }
            stockVersion: { type: integer }
            configVersion: { type: integer }
            computeMicros: { type: integer }
    SimulationResponse:
      allOf:
        - { $ref: '#/components/schemas/PromiseResponse' }
        - type: object
          properties:
            request: { $ref: '#/components/schemas/PromiseRequest' }
            nodes:
              type: object
              additionalProperties:
                type: object
                properties: { id: { type: string }, name: { type: string }, kind: { type: string }, city: { type: string }, lat: { type: number }, lon: { type: number } }
            stock:
              type: array
              items:
                type: object
                properties: { sku: { type: string }, requested: { type: integer }, totalPromisable: { type: integer }, pointsWithStock: { type: integer } }
            serverTimeMs: { type: number }
    GraphNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [STORE, WAREHOUSE, LAST_MILE_HUB, HUB] }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }
        active: { type: boolean }
        isHub: { type: boolean }
        consolidation: { type: boolean }
    CompiledPath:
      type: object
      properties:
        origin: { type: string }
        legs: { type: array, items: { type: string } }
        nodes: { type: array, items: { type: string } }
        carriers: { type: array, items: { type: string } }
        hubs: { type: array, items: { type: string } }
        routeId: { type: string }
    EngineSettings:
      type: object
      properties:
        weights: { $ref: '#/components/schemas/ScoringWeights' }
        beamWidth: { type: integer, minimum: 1, maximum: 64 }
        maxAllocations: { type: integer, minimum: 1, maximum: 100 }
        maxLegs: { type: integer, minimum: 1, maximum: 5 }
        maxHubsPerPlan: { type: integer, minimum: 1, maximum: 20 }
        maxCandidates: { type: integer, minimum: 1, maximum: 500, description: Stock points whose routes are timed per mode (pre-ranked by basket coverage then distance). }
        timezone: { type: string, example: Europe/Paris }
    LatencySnapshot:
      type: object
      properties:
        requests: { type: integer }
        errors: { type: integer }
        errorRate: { type: number }
        window: { type: integer }
        avgMs: { type: number }
        p50Ms: { type: number }
        p95Ms: { type: number }
        p99Ms: { type: number }
        maxMs: { type: number }
        rps1m: { type: number }
        rpsPeak: { type: number }
        uptimeSec: { type: number }
    System:
      type: object
      properties:
        goVersion: { type: string }
        numCpu: { type: integer }
        gomaxprocs: { type: integer }
        goroutines: { type: integer }
        heapAllocMb: { type: number }
        sysMb: { type: number }
        numGc: { type: integer }
        cpuSeconds: { type: number }
        os: { type: string }
        arch: { type: string }
    Dashboard:
      type: object
      properties:
        counts: { type: object, additionalProperties: true }
        promiseLatency: { $ref: '#/components/schemas/LatencySnapshot' }
        apiLatency: { $ref: '#/components/schemas/LatencySnapshot' }
        routeCacheHitRate: { type: number }
        system: { $ref: '#/components/schemas/System' }
        lastBenchmark: { $ref: '#/components/schemas/BenchmarkRun' }
        seed: { type: integer }
        platform: { type: string }
    BasketProfile:
      type: object
      properties:
        count: { type: integer, default: 2000 }
        seed: { type: integer }
        skusMin: { type: integer }
        skusMax: { type: integer }
        qtyMin: { type: integer }
        qtyMax: { type: integer }
        postalCodes: { type: array, items: { type: string } }
        modes: { type: array, items: { type: string } }
        pctMono: { type: number }
        pctMulti: { type: number }
        pctMultiSource: { type: number }
        pctConsolidation: { type: number }
        orderDate: { type: string, format: date-time }
        spreadOrderDates: { type: boolean }
    BenchmarkConfig:
      type: object
      properties:
        name: { type: string }
        profile: { type: string, example: vus-100 }
        vus: { type: integer, description: Virtual users (closed model) or max concurrency (open model). }
        durationSec: { type: integer }
        rateRps: { type: integer, description: '> 0 = constant arrival rate (open model).' }
        target: { type: string, enum: [inprocess, http], description: 'inprocess: handler + JSON, no network. http: real HTTP to baseUrl (default: the server itself).' }
        baseUrl: { type: string }
        baskets: { $ref: '#/components/schemas/BasketProfile' }
    LatencyStats:
      type: object
      properties:
        requests: { type: integer }
        errors: { type: integer }
        avgMs: { type: number }
        p50Ms: { type: number }
        p90Ms: { type: number }
        p95Ms: { type: number }
        p99Ms: { type: number }
        maxMs: { type: number }
        minMs: { type: number }
    BenchmarkRun:
      type: object
      properties:
        id: { type: string }
        source: { type: string, enum: [builtin, k6] }
        status: { type: string, enum: [running, completed, stopped, failed] }
        config: { $ref: '#/components/schemas/BenchmarkConfig' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        summary:
          allOf:
            - { $ref: '#/components/schemas/LatencyStats' }
            - type: object
              properties:
                errorRate: { type: number }
                rps: { type: number }
                durationSec: { type: number }
                cpuAvgPct: { type: number }
                cpuPeakPct: { type: number }
                memPeakMb: { type: number }
                cacheHitRate: { type: number }
                distinctBaskets: { type: integer }
                avgComputeMs: { type: number }
                droppedIterations: { type: integer }
                byCategory: { type: object, additionalProperties: { $ref: '#/components/schemas/LatencyStats' } }
                statusCodes: { type: object, additionalProperties: { type: integer } }
        series:
          type: array
          items:
            type: object
            properties:
              t: { type: integer }
              rps: { type: number }
              p50: { type: number }
              p95: { type: number }
              p99: { type: number }
              errors: { type: integer }
              cpuPct: { type: number }
              heapMb: { type: number }
        environment: { type: object, additionalProperties: true }
        error: { type: string }
    Rule:
      type: object
      required: [field, op]
      description: Test on an article field (built-in or `attributes.<key>`).
      properties:
        field: { type: string, example: attributes.hazmat, description: 'sku, name, category, weightKg, volumeL, lengthCm, widthCm, heightCm, longestSideCm, girthCm, sumDimensionsCm, priceEur or attributes.<key>' }
        op: { type: string, enum: [eq, neq, in, nin, lt, lte, gt, gte, between, exists, missing, contains] }
        value: { description: String, number or boolean. }
        values: { type: array, items: {}, description: 'Values of in / nin, [min, max] of between.' }
    Restriction:
      type: object
      required: [name, mode, rules]
      properties:
        name: { type: string, example: Matières dangereuses interdites }
        mode: { type: string, enum: [EXCLUDE_IF_ANY, REQUIRE_ALL], description: 'EXCLUDE_IF_ANY refuses an article matching any rule; REQUIRE_ALL accepts only articles matching every rule.' }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    Range:
      type: object
      description: '[min, max) on a variable; omitted bounds are open.'
      properties:
        min: { type: number }
        max: { type: number }
    Components:
      type: object
      description: 'One output = fixed + perKg × chargeableWeightKg + perItem × itemCount + perParcel × parcelCount + perKm × distanceKm + perKgKm × weightKg × distanceKm + percentOfValue % × (orderAmount for ORDER scope, goodsValue otherwise) + Σ perUnit[var] × var, clamped to [min, max].'
      properties:
        fixed: { type: number }
        perKg: { type: number }
        perItem: { type: number }
        perParcel: { type: number }
        perKm: { type: number }
        perKgKm: { type: number }
        percentOfValue: { type: number }
        perUnit: { type: object, additionalProperties: { type: number } }
        min: { type: number }
        max: { type: number }
    RateRow:
      type: object
      description: The first row whose conditions (and zones) all match gives the outputs.
      properties:
        label: { type: string }
        conditions: { type: object, additionalProperties: { $ref: '#/components/schemas/Range' } }
        zones: { type: array, items: { type: string }, description: Destination departments. }
        outputs: { type: object, additionalProperties: { $ref: '#/components/schemas/Components' }, description: 'Keys: cost, price, carbonKg or any custom output.' }
    Surcharge:
      type: object
      description: Cumulative addition when its conditions, zones and article rules match.
      properties:
        label: { type: string }
        conditions: { type: object, additionalProperties: { $ref: '#/components/schemas/Range' } }
        zones: { type: array, items: { type: string } }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' }, description: At least one article of the parcel must match every rule. }
        outputs: { type: object, additionalProperties: { $ref: '#/components/schemas/Components' } }
    DerivedMetric:
      type: object
      description: Linear combination of variables, e.g. length + 2 × width + 2 × height.
      properties:
        key: { type: string, example: longueurPlusPourtour }
        label: { type: string }
        terms: { type: array, items: { type: object, properties: { var: { type: string }, coef: { type: number } } } }
    RateCard:
      type: object
      required: [id, name, scope, rows]
      description: |
        Multi-dimensional tariff grid. Variables: weightKg, volumeL, volumetricWeightKg (L×W×H / volumetricDivisor),
        chargeableWeightKg (max of both), lengthCm / widthCm / heightCm (parcel bounding box, longest first), girthCm,
        sumDimensionsCm, itemCount, parcelCount, orderAmount, goodsValue, distanceKm, legs, transitDays, plus derived metrics.
        Attach PARCEL / SHIPMENT cards to carrier services (`rateCardIds`) or to legs (override), ORDER cards to delivery
        modes (`priceRateCardIds`) for the customer price and the franco.
      properties:
        id: { type: string, example: RC-COLIVIA-STD }
        name: { type: string }
        description: { type: string }
        carrierId: { type: string }
        scope: { type: string, enum: [PARCEL, SHIPMENT, ORDER] }
        currency: { type: string, default: EUR }
        volumetricDivisor: { type: number, example: 5000 }
        derived: { type: array, items: { $ref: '#/components/schemas/DerivedMetric' } }
        rows: { type: array, items: { $ref: '#/components/schemas/RateRow' } }
        surcharges: { type: array, items: { $ref: '#/components/schemas/Surcharge' } }
        noMatch: { type: string, enum: [REJECT, ZERO], description: 'REJECT makes the route infeasible when no row matches (parcel outside the grid).' }
        active: { type: boolean }
    QuoteRequest:
      type: object
      properties:
        card: { $ref: '#/components/schemas/RateCard' }
        items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
        vars: { type: object, additionalProperties: { type: number } }
        zone: { type: string }
        orderAmount: { type: number }
    QuoteResponse:
      type: object
      properties:
        cardId: { type: string }
        scope: { type: string }
        matched: { type: boolean }
        vars: { type: object, additionalProperties: { type: number } }
        outputs: { type: object, additionalProperties: { type: number } }
        warnings: { type: array, items: { type: string } }
    AdditionalService:
      type: object
      required: [id, name, outputs]
      properties:
        id: { type: string, example: INSTALLATION }
        name: { type: string }
        kind: { type: string, enum: [DELIVERY, INSTALLATION, ASSEMBLY, TAKE_BACK, APPOINTMENT, OTHER] }
        description: { type: string }
        appliesTo: { type: array, items: { $ref: '#/components/schemas/Rule' }, description: Articles concerned (all when empty). }
        outputs: { type: object, additionalProperties: { $ref: '#/components/schemas/Components' }, description: 'Per order (fixed) and per concerned item (perItem).' }
        extraDays: { type: integer, description: Delay in delivery working days. }
        active: { type: boolean }
    StockView:
      type: object
      required: [id, name]
      description: Stock points and articles a delivery mode (or a request) may use.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        pointIds: { type: array, items: { type: string } }
        pointTypes: { type: array, items: { type: string, enum: [STORE, WAREHOUSE, LAST_MILE_HUB] } }
        departments: { type: array, items: { type: string }, description: Postal code prefixes of the stock points. }
        excludePointIds: { type: array, items: { type: string } }
        articleRules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        reserve: { type: integer, description: Units kept back on every line on top of the safety stock. }
        active: { type: boolean }
    Criterion:
      type: object
      required: [metric]
      properties:
        metric: { type: string, example: carbonKg, description: 'deliveryHours, cost, price, carbonKg, packages, legs, sources or a custom rate card output.' }
        direction: { type: string, enum: [MIN, MAX], default: MIN }
        weight: { type: number }
        priority: { type: integer, description: 1 = most important (LEXICOGRAPHIC selection). }
        max: { type: number, description: Hard limit; options above it are removed. }
        tolerance: { type: number, description: Values closer than this are considered equal (LEXICOGRAPHIC). }
    PackageAlternative:
      type: object
      properties:
        stockPointId: { type: string }
        name: { type: string }
        type: { type: string }
        city: { type: string }
        distanceKm: { type: number }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
        deliveryHours: { type: number }
        parcels: { type: integer }
        carriers: { type: array, items: { type: string } }
        route: { type: array, items: { type: string } }
        metrics: { type: object, additionalProperties: { type: number } }
        current: { type: boolean }
    AdditionalServiceResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        requested: { type: boolean, description: 'true: applied to the option; false: offered by the delivering carrier.' }
        items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
        extraDays: { type: integer }
        metrics: { type: object, additionalProperties: { type: number } }
