openapi: 3.1.0
info:
  title: OneStock Delivery Promise API
  version: 1.0.0
  summary: Delivery promise and multi-leg routing engine.
  description: |
    The Delivery Promise API computes realistic delivery promises for a basket and a French
    destination. It allocates stock across stores, warehouses and last-mile hubs, builds
    physical parcels, routes them on multi-leg, multi-carrier paths, plans consolidations at
    hubs, applies calendars, cut-offs and French public holidays, then ranks the options with
    weighted criteria.

    **Base URL**: `/api/v1` (same origin as the web application).

    **Authentication**: read endpoints and the promise / simulation endpoints are public.
    Every write on the administration resources requires `Authorization: Bearer <ADMIN_TOKEN>`.

    **Errors** follow RFC 7807 (`application/problem+json`). Validation errors (422) list the
    invalid fields in `errors[]`.

    **Pagination**: list endpoints accept `page` (from 1) and `pageSize` (1 to 1000, default 50)
    and return `{items, page, pageSize, total}`.

    **Stock consistency**: a promise is computed on a consistent snapshot of the promisable stock
    (`physical - reserved - safetyStock`) taken at the start of the request. A promise never
    reserves stock. `stats.stockVersion` identifies the snapshot.
  contact:
    name: OneStock
servers:
  - url: /api/v1
    description: Same origin
tags:
  - name: Promise
    description: Delivery promise computation.
  - name: Simulation
    description: Basket simulation and saved scenarios.
  - name: Stock points
    description: Stores, warehouses and last-mile hubs holding stock.
  - name: Stock
    description: Stock lines, bulk updates and imports.
  - name: Catalog
    description: Shared SKU catalog.
  - name: Carriers
    description: Carriers and their services.
  - name: Network
    description: Hubs, legs, explicit routes and the compiled graph.
  - name: Delivery modes
    description: Commercial delivery modes.
  - name: Benchmarks
    description: Load tests and their history.
  - name: Operations
    description: Health, metrics, settings and calendars.
paths:
  /delivery-promises:
    post:
      tags: [Promise]
      operationId: createDeliveryPromise
      summary: Compute delivery promises
      description: |
        Returns up to `maxOptions` options ranked by score. The best option of every requested mode is
        always included, then the best option of every strategy (single source, multi-source direct,
        consolidated), then the remaining options by score. Modes that cannot be served are listed in
        `unavailable` with a reason code (`DESTINATION_NOT_SERVED`, `NO_STOCK`, `INSUFFICIENT_STOCK`,
        `NO_FEASIBLE_PLAN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromiseRequest' }
            example:
              destination: { country: FR, postalCode: '33000' }
              orderDate: '2026-10-12T10:00:00+02:00'
              items:
                - { sku: SKU-00001, quantity: 2 }
                - { sku: SKU-00002, quantity: 1 }
                - { sku: SKU-00003, quantity: 3 }
              deliveryModes: [STANDARD, EXPRESS]
              maxOptions: 5
      responses:
        '200':
          description: Promise options.
          headers:
            X-Calculation-Time-Ms:
              description: Engine computation time in milliseconds.
              schema: { type: number }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromiseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /simulations:
    post:
      tags: [Simulation]
      operationId: simulateBasket
      summary: Simulate a basket
      description: Same computation as `POST /delivery-promises`, enriched with node coordinates, basket stock availability and server timing for the web simulator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromiseRequest' }
      responses:
        '200':
          description: Simulation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /scenarios:
    get:
      tags: [Simulation]
      operationId: listScenarios
      summary: List scenarios
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/q' }]
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioPage' }
    post:
      tags: [Simulation]
      operationId: createScenario
      summary: Create a scenario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Scenario' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /scenarios/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Simulation]
      operationId: getScenario
      summary: Get a scenario
      responses:
        '200': { description: Scenario., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Simulation]
      operationId: updateScenario
      summary: Replace a scenario
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Simulation]
      operationId: deleteScenario
      summary: Delete a scenario
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{id}/run:
    post:
      tags: [Simulation]
      operationId: runScenario
      summary: Run a scenario
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Simulation result., content: { application/json: { schema: { $ref: '#/components/schemas/SimulationResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /stock-points:
    get:
      tags: [Stock points]
      operationId: listStockPoints
      summary: List stock points
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/q' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockPointType' } }
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200': { description: Stock points., content: { application/json: { schema: { $ref: '#/components/schemas/StockPointPage' } } } }
    post:
      tags: [Stock points]
      operationId: createStockPoint
      summary: Create a stock point
      description: Adds a column to the stock matrix (all SKUs unlisted until stock is imported).
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stock-points/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Stock points]
      operationId: getStockPoint
      summary: Get a stock point
      responses:
        '200': { description: Stock point., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock points]
      operationId: updateStockPoint
      summary: Replace a stock point
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/StockPoint' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Stock points]
      operationId: deleteStockPoint
      summary: Delete a stock point
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/stock:
    get:
      tags: [Stock points]
      operationId: listStockPointStock
      summary: List the stock of a point
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sku, in: query, schema: { type: string } }
        - { name: onlyAvailable, in: query, schema: { type: boolean }, description: Only lines with promisable stock. }
        - { name: all, in: query, schema: { type: boolean }, description: Include unlisted SKUs. }
      responses:
        '200': { description: Stock lines., content: { application/json: { schema: { $ref: '#/components/schemas/StockLinePage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/summary:
    get:
      tags: [Stock points]
      operationId: getStockPointSummary
      summary: Stock summary of a point
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/StockSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /stock-points/{id}/connections:
    get:
      tags: [Stock points]
      operationId: getStockPointConnections
      summary: Legs leaving and reaching a node
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outgoing: { type: array, items: { $ref: '#/components/schemas/Leg' } }
                  incoming: { type: array, items: { $ref: '#/components/schemas/Leg' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /stock:
    get:
      tags: [Stock]
      operationId: listStock
      summary: Query stock lines
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: stockPointId, in: query, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: onlyAvailable, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Stock lines., content: { application/json: { schema: { $ref: '#/components/schemas/StockLinePage' } } } }
    patch:
      tags: [Stock]
      operationId: patchStock
      summary: Apply a batch of stock updates
      description: |
        Applied atomically with respect to promise computations (one write lock, one stock version).
        Invalid lines are reported and skipped. `delta` adjusts the physical quantity relatively.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/StockUpdate' } }
            example:
              - { stockPointId: STORE-001, sku: SKU-00001, physical: 12, reserved: 1 }
              - { stockPointId: WH-01, sku: SKU-00002, delta: -3 }
      responses:
        '200': { description: Batch result., content: { application/json: { schema: { $ref: '#/components/schemas/StockBatchResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock/import:
    post:
      tags: [Stock]
      operationId: importStock
      summary: Bulk import stock
      description: |
        Accepts `text/csv` (`stockPointId,sku,physical[,reserved]`, optional header line) or a JSON array of
        stock updates. Up to 2,000,000 lines and 128 MB per call. Incremental: the availability bitmaps are
        updated line by line, no index rebuild.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "stockPointId,sku,physical,reserved\nSTORE-001,SKU-00001,4,0\nWH-01,SKU-00002,120,10\n"
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/StockUpdate' } }
      responses:
        '200': { description: Import result., content: { application/json: { schema: { $ref: '#/components/schemas/StockBatchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock/{stockPointId}/{sku}:
    parameters:
      - { name: stockPointId, in: path, required: true, schema: { type: string } }
      - { name: sku, in: path, required: true, schema: { type: string } }
    get:
      tags: [Stock]
      operationId: getStockLine
      summary: Get a stock line
      responses:
        '200': { description: Stock line., content: { application/json: { schema: { $ref: '#/components/schemas/StockLine' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      operationId: putStockLine
      summary: Set a stock line
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physical]
              properties:
                physical: { type: integer, minimum: 0 }
                reserved: { type: integer, minimum: 0 }
                listed: { type: boolean, default: true }
      responses:
        '200': { description: Stock line., content: { application/json: { schema: { $ref: '#/components/schemas/StockLine' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /skus:
    get:
      tags: [Catalog]
      operationId: listSkus
      summary: Search the catalog
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/q' }]
      responses:
        '200': { description: SKUs., content: { application/json: { schema: { $ref: '#/components/schemas/SkuPage' } } } }
  /skus/{sku}:
    get:
      tags: [Catalog]
      operationId: getSku
      summary: Get a SKU
      parameters: [{ name: sku, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: SKU., content: { application/json: { schema: { $ref: '#/components/schemas/Sku' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /skus/{sku}/availability:
    get:
      tags: [Catalog]
      operationId: getSkuAvailability
      summary: Availability of a SKU in every stock point
      parameters: [{ name: sku, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Availability sorted by promisable quantity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku: { $ref: '#/components/schemas/Sku' }
                  totalPromisable: { type: integer }
                  lines: { type: array, items: { $ref: '#/components/schemas/StockLine' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /carriers:
    get:
      tags: [Carriers]
      operationId: listCarriers
      summary: List carriers
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/q' }]
      responses:
        '200': { description: Carriers., content: { application/json: { schema: { $ref: '#/components/schemas/CarrierPage' } } } }
    post:
      tags: [Carriers]
      operationId: createCarrier
      summary: Create a carrier
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Carrier' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Carrier' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /carriers/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Carriers]
      operationId: getCarrier
      summary: Get a carrier
      responses:
        '200': { description: Carrier., content: { application/json: { schema: { $ref: '#/components/schemas/Carrier' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Carriers]
      operationId: updateCarrier
      summary: Replace a carrier
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Carrier' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Carrier' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Carriers]
      operationId: deleteCarrier
      summary: Delete a carrier
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services:
    get:
      tags: [Carriers]
      operationId: listServices
      summary: List carrier services
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/q' }
        - { name: carrierId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ServiceKind' } }
      responses:
        '200': { description: Services., content: { application/json: { schema: { $ref: '#/components/schemas/ServicePage' } } } }
    post:
      tags: [Carriers]
      operationId: createService
      summary: Create a service
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CarrierService' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/CarrierService' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /services/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Carriers]
      operationId: getService
      summary: Get a service
      responses:
        '200': { description: Service., content: { application/json: { schema: { $ref: '#/components/schemas/CarrierService' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Carriers]
      operationId: updateService
      summary: Replace a service
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CarrierService' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/CarrierService' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Carriers]
      operationId: deleteService
      summary: Delete a service
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hubs:
    get:
      tags: [Network]
      operationId: listHubs
      summary: List hubs
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/q' }
        - { name: kind, in: query, schema: { type: string, enum: [CONSOLIDATION, LAST_MILE] } }
      responses:
        '200': { description: Hubs., content: { application/json: { schema: { $ref: '#/components/schemas/HubPage' } } } }
    post:
      tags: [Network]
      operationId: createHub
      summary: Create a hub
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Hub' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Hub' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /hubs/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Network]
      operationId: getHub
      summary: Get a hub
      responses:
        '200': { description: Hub., content: { application/json: { schema: { $ref: '#/components/schemas/Hub' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Network]
      operationId: updateHub
      summary: Replace a hub
      description: Set `active` to false or add an `unavailability` period to make a hub temporarily unavailable.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Hub' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Hub' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Network]
      operationId: deleteHub
      summary: Delete a hub
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legs:
    get:
      tags: [Network]
      operationId: listLegs
      summary: List legs
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: node, in: query, schema: { type: string }, description: Legs leaving or reaching this node. }
        - { name: carrierId, in: query, schema: { type: string } }
        - { name: serviceId, in: query, schema: { type: string } }
      responses:
        '200': { description: Legs., content: { application/json: { schema: { $ref: '#/components/schemas/LegPage' } } } }
    post:
      tags: [Network]
      operationId: createLeg
      summary: Create a leg
      description: A leg ends at a hub or at `CUSTOMER`; its service must belong to its carrier.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Leg' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Leg' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /legs/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Network]
      operationId: getLeg
      summary: Get a leg
      responses:
        '200': { description: Leg., content: { application/json: { schema: { $ref: '#/components/schemas/Leg' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Network]
      operationId: updateLeg
      summary: Replace a leg
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Leg' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Leg' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Network]
      operationId: deleteLeg
      summary: Delete a leg
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /routes:
    get:
      tags: [Network]
      operationId: listRoutes
      summary: List explicit routes
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/q' }]
      responses:
        '200': { description: Routes., content: { application/json: { schema: { $ref: '#/components/schemas/RoutePage' } } } }
    post:
      tags: [Network]
      operationId: createRoute
      summary: Create an explicit route
      description: Legs must be contiguous and only the last one may end at `CUSTOMER`. Explicit routes are always considered, even beyond the automatic search depth.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /routes/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Network]
      operationId: getRoute
      summary: Get a route
      responses:
        '200': { description: Route., content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Network]
      operationId: updateRoute
      summary: Replace a route
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Network]
      operationId: deleteRoute
      summary: Delete a route
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /network/graph:
    get:
      tags: [Network]
      operationId: getNetworkGraph
      summary: Nodes, legs and routes of the network
      responses:
        '200':
          description: Graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
                  legs: { type: array, items: { $ref: '#/components/schemas/Leg' } }
                  routes: { type: array, items: { $ref: '#/components/schemas/Route' } }
  /network/routes:
    get:
      tags: [Network]
      operationId: getCompiledRoutes
      summary: Paths towards a delivery zone
      description: Bounded paths (auto-discovered up to the mode's `maxLegs`, plus explicit routes) reaching the department of a postal code for a mode.
      parameters:
        - { name: postalCode, in: query, required: true, schema: { type: string, pattern: '^[0-9]{5}$' } }
        - { name: mode, in: query, required: true, schema: { type: string } }
        - { name: origin, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paths.
          content:
            application/json:
              schema:
                type: object
                properties:
                  department: { type: string }
                  mode: { type: string }
                  count: { type: integer }
                  paths: { type: array, items: { $ref: '#/components/schemas/CompiledPath' } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /delivery-modes:
    get:
      tags: [Delivery modes]
      operationId: listDeliveryModes
      summary: List delivery modes
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }]
      responses:
        '200': { description: Delivery modes., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryModePage' } } } }
    post:
      tags: [Delivery modes]
      operationId: createDeliveryMode
      summary: Create a delivery mode
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryMode' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryMode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /delivery-modes/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Delivery modes]
      operationId: getDeliveryMode
      summary: Get a delivery mode
      responses:
        '200': { description: Delivery mode., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryMode' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Delivery modes]
      operationId: updateDeliveryMode
      summary: Replace a delivery mode
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryMode' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryMode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Delivery modes]
      operationId: deleteDeliveryMode
      summary: Delete a delivery mode
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /benchmarks:
    get:
      tags: [Benchmarks]
      operationId: listBenchmarks
      summary: Benchmark history
      description: Most recent first, without time series.
      responses:
        '200':
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BenchmarkRun' } }
                  total: { type: integer }
    post:
      tags: [Benchmarks]
      operationId: startBenchmark
      summary: Start a benchmark
      description: |
        Starts a built-in load test on varied generated baskets. Returns 202 immediately with the run; poll
        `GET /benchmarks/{id}`. With `?wait=true` (forced on Vercel, capped at 25 s) the call blocks and returns 200.
        Only one run at a time (409 otherwise).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: wait, in: query, schema: { type: boolean } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkConfig' } } } }
      responses:
        '200': { description: Finished run (wait mode)., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '202': { description: Run started., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /benchmarks/presets:
    get:
      tags: [Benchmarks]
      operationId: listBenchmarkPresets
      summary: Predefined load profiles
      responses:
        '200': { description: Presets., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BenchmarkConfig' } } } } }
  /benchmarks/baskets:
    get:
      tags: [Benchmarks]
      operationId: generateBenchmarkBaskets
      summary: Generate a basket pool
      description: Reproducible pool of varied baskets used by k6 (`setup()`) and the built-in runner. Multi-source baskets are verified against the stock.
      parameters:
        - { name: count, in: query, schema: { type: integer, default: 1000, maximum: 20000 } }
        - { name: seed, in: query, schema: { type: integer, default: 1 } }
        - { name: skusMin, in: query, schema: { type: integer, default: 2 } }
        - { name: skusMax, in: query, schema: { type: integer, default: 5 } }
        - { name: qtyMin, in: query, schema: { type: integer, default: 1 } }
        - { name: qtyMax, in: query, schema: { type: integer, default: 2 } }
        - { name: pctMono, in: query, schema: { type: number, default: 30 } }
        - { name: pctMulti, in: query, schema: { type: number, default: 40 } }
        - { name: pctMultiSource, in: query, schema: { type: number, default: 20 } }
        - { name: pctConsolidation, in: query, schema: { type: number, default: 10 } }
        - { name: postalCodes, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: modes, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: spread, in: query, schema: { type: boolean }, description: Spread order dates over a week. }
      responses:
        '200':
          description: Baskets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string, enum: [mono, multi, multi-source, consolidation] }
                    request: { $ref: '#/components/schemas/PromiseRequest' }
  /benchmarks/import:
    post:
      tags: [Benchmarks]
      operationId: importBenchmark
      summary: Import an external run (k6)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
      responses:
        '201': { description: Imported., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /benchmarks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Benchmarks]
      operationId: getBenchmark
      summary: Get a run with its time series
      responses:
        '200': { description: Run., content: { application/json: { schema: { $ref: '#/components/schemas/BenchmarkRun' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Benchmarks]
      operationId: deleteBenchmark
      summary: Delete a finished run
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /benchmarks/{id}/stop:
    post:
      tags: [Benchmarks]
      operationId: stopBenchmark
      summary: Stop a running benchmark
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '202': { description: Stopping. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Health check
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  seed: { type: integer }
                  platform: { type: string, example: vercel }
                  persistence: { type: boolean }
                  persistError: { type: string }
                  stockLines: { type: integer }
                  uptimeSec: { type: number }
  /dashboard:
    get:
      tags: [Operations]
      operationId: dashboard
      summary: Dashboard data
      description: Counts, live latency of the promise API (ring buffer of the last 20,000 requests of this instance), route cache hit rate, process resources and last benchmark.
      responses:
        '200': { description: Dashboard., content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Live metrics
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  promise: { $ref: '#/components/schemas/LatencySnapshot' }
                  api: { $ref: '#/components/schemas/LatencySnapshot' }
                  system: { $ref: '#/components/schemas/System' }
  /metrics/reset:
    post:
      tags: [Operations]
      operationId: resetMetrics
      summary: Reset live metrics
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Reset. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings:
    get:
      tags: [Operations]
      operationId: getSettings
      summary: Engine settings
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
    put:
      tags: [Operations]
      operationId: putSettings
      summary: Update engine settings
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/EngineSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /calendar/holidays:
    get:
      tags: [Operations]
      operationId: listHolidays
      summary: French public holidays
      parameters: [{ name: year, in: query, schema: { type: integer, example: 2026 } }]
      responses:
        '200':
          description: Holidays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  holidays:
                    type: array
                    items: { type: object, properties: { date: { type: string, format: date }, name: { type: string } } }
  /admin/reseed:
    post:
      tags: [Operations]
      operationId: reseed
      summary: Regenerate the dataset
      description: Rebuilds the full reference dataset (120 stock points, 1.2M stock lines) from a seed and swaps it atomically. With PostgreSQL, the database is replaced too.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [seed], properties: { seed: { type: integer, example: 42 } } }
      responses:
        '200': { description: Regenerated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/check:
    get:
      tags: [Operations]
      operationId: checkAuth
      summary: Check the admin token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token valid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openapi.json:
    get:
      tags: [Operations]
      operationId: openapi
      summary: This OpenAPI document
      responses:
        '200': { description: OpenAPI 3.1 document. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Admin token (`ADMIN_TOKEN` environment variable).
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
    q: { name: q, in: query, description: Case-insensitive search., schema: { type: string } }
  responses:
    BadRequest:
      description: Malformed request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing or invalid admin token.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Already exists or already running.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Invalid fields.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://dp100ms.onestock.dev/problems/validation-error
            title: Unprocessable Entity
            status: 422
            detail: the request contains invalid fields
            instance: /api/v1/delivery-promises
            errors:
              - { field: destination.postalCode, message: postal code must have 5 digits }
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    TimeOfDay: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$', example: '17:30', description: Local wall-clock time (Europe/Paris). }
    Calendar:
      type: object
      required: [workingDays]
      properties:
        workingDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: '1 = Monday … 7 = Sunday', example: [1, 2, 3, 4, 5] }
        honorHolidays: { type: boolean, description: Skip French public holidays. }
        closedDates: { type: array, items: { type: string, format: date } }
    StockPointType: { type: string, enum: [STORE, WAREHOUSE, LAST_MILE_HUB] }
    StockPoint:
      type: object
      required: [id, name, type, address, lat, lon, openingTime, closingTime, prepCalendar]
      properties:
        id: { type: string, example: STORE-001 }
        name: { type: string, example: Magasin Paris 1 }
        type: { $ref: '#/components/schemas/StockPointType' }
        address:
          type: object
          properties:
            line1: { type: string }
            postalCode: { type: string, pattern: '^[0-9]{5}$' }
            city: { type: string }
            country: { type: string, default: FR }
        lat: { type: number }
        lon: { type: number }
        timezone: { type: string, default: Europe/Paris }
        openingTime: { $ref: '#/components/schemas/TimeOfDay' }
        closingTime: { $ref: '#/components/schemas/TimeOfDay' }
        prepCalendar: { $ref: '#/components/schemas/Calendar' }
        prepTimeMinutes: { type: integer, minimum: 0 }
        cutoff: { $ref: '#/components/schemas/TimeOfDay' }
        dailyCapacity: { type: integer }
        safetyStock: { type: integer, minimum: 0, description: Units kept back from the promisable quantity of every SKU. }
        allowedModes: { type: array, items: { type: string } }
        prepCostPerParcel: { type: number }
        active: { type: boolean }
    Carrier:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: COLIVIA }
        name: { type: string, example: Colivia }
        active: { type: boolean }
    ServiceKind: { type: string, enum: [STANDARD, EXPRESS, SAME_DAY, HOME, RELAY, STORE_DELIVERY, LAST_MILE, LINEHAUL, SHUTTLE] }
    CarrierService:
      type: object
      required: [id, carrierId, name, kind, pickupCalendar, deliveryCalendar]
      properties:
        id: { type: string, example: COLIVIA-STD }
        carrierId: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ServiceKind' }
        modes: { type: array, items: { type: string }, description: Delivery modes this service fulfils as a final leg. }
        coverage: { type: array, items: { type: string }, description: 'Department codes, or "*" for metropolitan France ("20" = Corsica).' }
        excludedCoverage: { type: array, items: { type: string } }
        servedPostalCodes: { type: array, items: { type: string }, description: Optional postal code prefixes restricting coverage. }
        transitDays: { type: integer, description: Final-leg transit in delivery working days (0 = same day). }
        transitMinutes: { type: integer, description: Transit of hub-bound legs. }
        pickupCalendar: { $ref: '#/components/schemas/Calendar' }
        deliveryCalendar: { $ref: '#/components/schemas/Calendar' }
        cutoff: { $ref: '#/components/schemas/TimeOfDay' }
        windowStart: { $ref: '#/components/schemas/TimeOfDay' }
        windowEnd: { $ref: '#/components/schemas/TimeOfDay' }
        maxWeightKg: { type: number }
        maxVolumeL: { type: number }
        maxItems: { type: integer }
        dailyCapacity: { type: integer }
        baseCost: { type: number, description: Cost per parcel (EUR). }
        costPerKg: { type: number }
        active: { type: boolean }
    Unavailability:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        reason: { type: string }
    Hub:
      type: object
      required: [id, name, kind, calendar]
      properties:
        id: { type: string, example: HUB-IDF }
        name: { type: string }
        kind: { type: string, enum: [CONSOLIDATION, LAST_MILE] }
        stockPointId: { type: string, description: Set when the hub is also a stock point (same id). }
        postalCode: { type: string }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }
        calendar: { $ref: '#/components/schemas/Calendar' }
        openingTime: { $ref: '#/components/schemas/TimeOfDay' }
        closingTime: { $ref: '#/components/schemas/TimeOfDay' }
        sortingMinutes: { type: integer }
        consolidationEnabled: { type: boolean }
        consolidationMinutes: { type: integer }
        maxConsolidationWaitHours: { type: integer, description: Max wait between the first and the last component (0 = unbounded). }
        consolidationCost: { type: number }
        unavailability: { type: array, items: { $ref: '#/components/schemas/Unavailability' } }
        active: { type: boolean }
    Leg:
      type: object
      required: [id, from, to, carrierId, serviceId]
      properties:
        id: { type: string, example: LEG-0001 }
        from: { type: string }
        to: { type: string, description: Hub id or CUSTOMER. }
        carrierId: { type: string }
        serviceId: { type: string }
        destinationZones: { type: array, items: { type: string } }
        departures: { type: array, items: { $ref: '#/components/schemas/TimeOfDay' } }
        cutoffMinutesBefore: { type: integer }
        calendar: { $ref: '#/components/schemas/Calendar' }
        transitMinutes: { type: integer }
        extraCost: { type: number }
        maxWeightKg: { type: number }
        modes: { type: array, items: { type: string } }
        active: { type: boolean }
    Route:
      type: object
      required: [id, name, legIds]
      properties:
        id: { type: string }
        name: { type: string }
        legIds: { type: array, items: { type: string } }
        modes: { type: array, items: { type: string } }
        description: { type: string }
        active: { type: boolean }
    DeliveryMode:
      type: object
      required: [id, name, maxLegs, maxSources]
      properties:
        id: { type: string, example: EXPRESS }
        name: { type: string }
        description: { type: string }
        maxLegs: { type: integer, minimum: 1, maximum: 5 }
        maxSources: { type: integer, minimum: 1, maximum: 6 }
        allowConsolidation: { type: boolean }
        allowSplit: { type: boolean, description: Allow one SKU to be split across several sources. }
        maxDeliveryDays: { type: integer, description: Max business days between order and delivery. }
        price: { type: number }
        active: { type: boolean }
    Sku:
      type: object
      properties:
        sku: { type: string, example: SKU-00001 }
        name: { type: string }
        category: { type: string }
        weightKg: { type: number }
        volumeL: { type: number }
    StockLine:
      type: object
      properties:
        stockPointId: { type: string }
        sku: { type: string }
        physical: { type: integer }
        reserved: { type: integer }
        available: { type: integer, description: physical - reserved }
        promisable: { type: integer, description: available - safetyStock (0 when unlisted) }
        listed: { type: boolean }
    StockUpdate:
      type: object
      required: [stockPointId, sku]
      properties:
        stockPointId: { type: string }
        sku: { type: string }
        physical: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        delta: { type: integer }
        listed: { type: boolean }
    StockBatchResult:
      type: object
      properties:
        applied: { type: integer }
        rejected: { type: integer }
        errors: { type: array, items: { type: object, properties: { index: { type: integer }, reason: { type: string } } } }
        stockVersion: { type: integer }
        durationMs: { type: number }
    StockSummary:
      type: object
      properties:
        lines: { type: integer }
        listed: { type: integer }
        availableSkus: { type: integer }
        outOfStockSkus: { type: integer }
        totalUnits: { type: integer }
        reservedUnits: { type: integer }
    Scenario:
      type: object
      required: [id, name, request]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        request: { $ref: '#/components/schemas/PromiseRequest' }
        createdAt: { type: string, format: date-time }
    BasketItem:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string, example: SKU-00001 }
        quantity: { type: integer, minimum: 1 }
    ScoringWeights:
      type: object
      description: Relative weights (normalised) of the ranking criteria.
      properties:
        deliveryTime: { type: number, minimum: 0, example: 0.45 }
        packages: { type: number, minimum: 0, example: 0.2 }
        cost: { type: number, minimum: 0, example: 0.2 }
        legs: { type: number, minimum: 0, example: 0.05 }
        sources: { type: number, minimum: 0, example: 0.1 }
    PromiseRequest:
      type: object
      required: [destination, orderDate, items]
      properties:
        destination:
          type: object
          required: [postalCode]
          properties:
            country: { type: string, enum: [FR], default: FR }
            postalCode: { type: string, pattern: '^[0-9]{5}$', example: '33000' }
        orderDate: { type: string, format: date-time, example: '2026-10-12T10:00:00+02:00' }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/BasketItem' }, description: Duplicated SKUs are merged; at most 500 units. }
        deliveryModes: { type: array, items: { type: string }, description: Defaults to every active mode. }
        maxOptions: { type: integer, minimum: 1, maximum: 50, default: 5 }
        constraints:
          type: object
          properties:
            maxPackages: { type: integer }
            maxWeightKg: { type: number, description: Max weight per package. }
            maxItems: { type: integer, description: Max units per package. }
            forbidConsolidation: { type: boolean }
            maxSources: { type: integer }
        weights: { $ref: '#/components/schemas/ScoringWeights' }
        debug: { type: boolean }
    TimeWindow:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    LegResult:
      type: object
      properties:
        legId: { type: string }
        from: { type: string }
        to: { type: string }
        carrier: { type: string }
        carrierName: { type: string }
        service: { type: string }
        serviceKind: { $ref: '#/components/schemas/ServiceKind' }
        estimatedDeparture: { type: string, format: date-time }
        estimatedArrival: { type: string, format: date-time, description: For the final leg, end of the delivery window. }
        cost: { type: number }
    PackageResult:
      type: object
      description: A physical parcel delivered to the customer.
      properties:
        packageId: { type: string, example: PKG-001 }
        items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
        sourceStockPoints: { type: array, items: { type: string } }
        weightKg: { type: number }
        volumeL: { type: number }
        route: { type: array, items: { $ref: '#/components/schemas/LegResult' }, description: Inbound legs of every contributing source (consolidated parcels), then the parcel's own legs. }
        hubs: { type: array, items: { type: string } }
        consolidationId: { type: string }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
    PromiseOption:
      type: object
      properties:
        id: { type: string }
        deliveryMode: { type: string }
        strategy: { type: string, enum: [SINGLE_SOURCE, MULTI_SOURCE_DIRECT, CONSOLIDATED] }
        estimatedDelivery: { $ref: '#/components/schemas/TimeWindow' }
        totalPackages: { type: integer, description: Parcels delivered to the customer. }
        packagesBeforeConsolidation: { type: integer, description: Parcels leaving the stock points. }
        totalCost: { type: number }
        currency: { type: string, example: EUR }
        packages: { type: array, items: { $ref: '#/components/schemas/PackageResult' } }
        allocations:
          type: array
          items: { type: object, properties: { stockPointId: { type: string }, sku: { type: string }, quantity: { type: integer } } }
        preparationGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              stockPointId: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
              readyAt: { type: string, format: date-time }
              parcels: { type: integer }
        shipments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              packageId: { type: string }
              kind: { type: string, enum: [DIRECT, INBOUND, OUTBOUND] }
              origin: { type: string }
              destination: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/BasketItem' } }
              legs: { type: array, items: { $ref: '#/components/schemas/LegResult' } }
        consolidations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              hubId: { type: string }
              hubName: { type: string }
              inboundShipments: { type: array, items: { type: string } }
              lastArrival: { type: string, format: date-time }
              readyAt: { type: string, format: date-time }
              outboundPackages: { type: array, items: { type: string } }
              cost: { type: number }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              type: { type: string, enum: [ORDER, PREPARATION_READY, DEPARTURE, ARRIVAL, CONSOLIDATION_READY, DELIVERY] }
              node: { type: string }
              packageId: { type: string }
              description: { type: string }
        criteria:
          type: object
          properties:
            deliveryHours: { type: number }
            packages: { type: integer }
            cost: { type: number }
            legs: { type: integer }
            sources: { type: integer }
        score: { type: number, minimum: 0, maximum: 1, description: '1 - weighted min-max normalised penalty within the mode.' }
    PromiseResponse:
      type: object
      properties:
        requestId: { type: string }
        options: { type: array, items: { $ref: '#/components/schemas/PromiseOption' } }
        unavailable:
          type: array
          items:
            type: object
            properties:
              deliveryMode: { type: string }
              code: { type: string, enum: [DESTINATION_NOT_SERVED, NO_STOCK, INSUFFICIENT_STOCK, NO_FEASIBLE_PLAN] }
              reason: { type: string }
        calculationTimeMs: { type: number, description: Engine time (excludes HTTP and JSON). }
        stats:
          type: object
          properties:
            candidateStockPoints: { type: integer }
            allocations: { type: integer }
            plansEvaluated: { type: integer }
            pathsConsidered: { type: integer }
            routeCacheHit: { type: boolean }
            stockVersion: { type: integer }
            configVersion: { type: integer }
            computeMicros: { type: integer }
    SimulationResponse:
      allOf:
        - { $ref: '#/components/schemas/PromiseResponse' }
        - type: object
          properties:
            request: { $ref: '#/components/schemas/PromiseRequest' }
            nodes:
              type: object
              additionalProperties:
                type: object
                properties: { id: { type: string }, name: { type: string }, kind: { type: string }, city: { type: string }, lat: { type: number }, lon: { type: number } }
            stock:
              type: array
              items:
                type: object
                properties: { sku: { type: string }, requested: { type: integer }, totalPromisable: { type: integer }, pointsWithStock: { type: integer } }
            serverTimeMs: { type: number }
    GraphNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [STORE, WAREHOUSE, LAST_MILE_HUB, HUB] }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }
        active: { type: boolean }
        isHub: { type: boolean }
        consolidation: { type: boolean }
    CompiledPath:
      type: object
      properties:
        origin: { type: string }
        legs: { type: array, items: { type: string } }
        nodes: { type: array, items: { type: string } }
        carriers: { type: array, items: { type: string } }
        hubs: { type: array, items: { type: string } }
        routeId: { type: string }
    EngineSettings:
      type: object
      properties:
        weights: { $ref: '#/components/schemas/ScoringWeights' }
        beamWidth: { type: integer, minimum: 1, maximum: 64 }
        maxAllocations: { type: integer, minimum: 1, maximum: 100 }
        maxLegs: { type: integer, minimum: 1, maximum: 5 }
        maxHubsPerPlan: { type: integer, minimum: 1, maximum: 20 }
        maxCandidates: { type: integer, minimum: 1, maximum: 500, description: Stock points whose routes are timed per mode (pre-ranked by basket coverage then distance). }
        timezone: { type: string, example: Europe/Paris }
    LatencySnapshot:
      type: object
      properties:
        requests: { type: integer }
        errors: { type: integer }
        errorRate: { type: number }
        window: { type: integer }
        avgMs: { type: number }
        p50Ms: { type: number }
        p95Ms: { type: number }
        p99Ms: { type: number }
        maxMs: { type: number }
        rps1m: { type: number }
        rpsPeak: { type: number }
        uptimeSec: { type: number }
    System:
      type: object
      properties:
        goVersion: { type: string }
        numCpu: { type: integer }
        gomaxprocs: { type: integer }
        goroutines: { type: integer }
        heapAllocMb: { type: number }
        sysMb: { type: number }
        numGc: { type: integer }
        cpuSeconds: { type: number }
        os: { type: string }
        arch: { type: string }
    Dashboard:
      type: object
      properties:
        counts: { type: object, additionalProperties: true }
        promiseLatency: { $ref: '#/components/schemas/LatencySnapshot' }
        apiLatency: { $ref: '#/components/schemas/LatencySnapshot' }
        routeCacheHitRate: { type: number }
        system: { $ref: '#/components/schemas/System' }
        lastBenchmark: { $ref: '#/components/schemas/BenchmarkRun' }
        seed: { type: integer }
        platform: { type: string }
    BasketProfile:
      type: object
      properties:
        count: { type: integer, default: 2000 }
        seed: { type: integer }
        skusMin: { type: integer }
        skusMax: { type: integer }
        qtyMin: { type: integer }
        qtyMax: { type: integer }
        postalCodes: { type: array, items: { type: string } }
        modes: { type: array, items: { type: string } }
        pctMono: { type: number }
        pctMulti: { type: number }
        pctMultiSource: { type: number }
        pctConsolidation: { type: number }
        orderDate: { type: string, format: date-time }
        spreadOrderDates: { type: boolean }
    BenchmarkConfig:
      type: object
      properties:
        name: { type: string }
        profile: { type: string, example: vus-100 }
        vus: { type: integer, description: Virtual users (closed model) or max concurrency (open model). }
        durationSec: { type: integer }
        rateRps: { type: integer, description: '> 0 = constant arrival rate (open model).' }
        target: { type: string, enum: [inprocess, http], description: 'inprocess: handler + JSON, no network. http: real HTTP to baseUrl (default: the server itself).' }
        baseUrl: { type: string }
        baskets: { $ref: '#/components/schemas/BasketProfile' }
    LatencyStats:
      type: object
      properties:
        requests: { type: integer }
        errors: { type: integer }
        avgMs: { type: number }
        p50Ms: { type: number }
        p90Ms: { type: number }
        p95Ms: { type: number }
        p99Ms: { type: number }
        maxMs: { type: number }
        minMs: { type: number }
    BenchmarkRun:
      type: object
      properties:
        id: { type: string }
        source: { type: string, enum: [builtin, k6] }
        status: { type: string, enum: [running, completed, stopped, failed] }
        config: { $ref: '#/components/schemas/BenchmarkConfig' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        summary:
          allOf:
            - { $ref: '#/components/schemas/LatencyStats' }
            - type: object
              properties:
                errorRate: { type: number }
                rps: { type: number }
                durationSec: { type: number }
                cpuAvgPct: { type: number }
                cpuPeakPct: { type: number }
                memPeakMb: { type: number }
                cacheHitRate: { type: number }
                distinctBaskets: { type: integer }
                avgComputeMs: { type: number }
                droppedIterations: { type: integer }
                byCategory: { type: object, additionalProperties: { $ref: '#/components/schemas/LatencyStats' } }
                statusCodes: { type: object, additionalProperties: { type: integer } }
        series:
          type: array
          items:
            type: object
            properties:
              t: { type: integer }
              rps: { type: number }
              p50: { type: number }
              p95: { type: number }
              p99: { type: number }
              errors: { type: integer }
              cpuPct: { type: number }
              heapMb: { type: number }
        environment: { type: object, additionalProperties: true }
        error: { type: string }
    StockPointPage: { $ref: '#/components/schemas/_Page', x-items: StockPoint }
    StockLinePage: { $ref: '#/components/schemas/_Page', x-items: StockLine }
    SkuPage: { $ref: '#/components/schemas/_Page', x-items: Sku }
    CarrierPage: { $ref: '#/components/schemas/_Page', x-items: Carrier }
    ServicePage: { $ref: '#/components/schemas/_Page', x-items: CarrierService }
    HubPage: { $ref: '#/components/schemas/_Page', x-items: Hub }
    LegPage: { $ref: '#/components/schemas/_Page', x-items: Leg }
    RoutePage: { $ref: '#/components/schemas/_Page', x-items: Route }
    DeliveryModePage: { $ref: '#/components/schemas/_Page', x-items: DeliveryMode }
    ScenarioPage: { $ref: '#/components/schemas/_Page', x-items: Scenario }
    _Page:
      type: object
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
